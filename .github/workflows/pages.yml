# Alur kerja Pages — Toko Beras M.IQBAL
# Dipakai sejak 6 Agustus 2026 setelah pembangun bawaan Pages gagal berulang.
# Tidak ada build: berkas di repo disalin apa adanya (satu HTML statis tanpa framework).
#
# Sejak putaran rapi-rapi 0 (13 Sep 2026): job `uji` berjalan di SETIAP push/PR dan
# job `terbitkan` hanya jalan di main SESUDAH `uji` hijau. Sebelumnya setiap push ke main
# langsung terbit ke toko tanpa satu pun langkah uji — dan satu referensi salah lingkup
# pernah tiga kali mematikan seluruh aplikasi (7 Sep 2026).
name: Uji lalu terbitkan Pages

on:
  # 22 Nov 2026 (owner: "bisa dipercepat?"): push diuji HANYA di main (terbit). Cabang diuji lewat pull_request — dulu push + pull_request di cabang
  # ber-PR menjalankan SEMUA job dua kali, dan runner macOS gratis paling banyak 5 sekaligus → antre.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  uji:
    # macos-latest: jsc (JavaScriptCore) tersedia bawaan — sama dengan mesin pengembang.
    runs-on: macos-latest
    # Batas 10 menit dipasang 13 Sep saat pekerjaan ini masih kecil. Per 7 Okt pekerjaan ini ±6½–10 menit (70-an langkah, tergantung runner;
    # langkah terakhir — Chrome palsu percobaan ulang + kontrolnya — sendiri ±4 menit). PR #113 (run 37529470063) dihentikan di 10 menit 23 detik
    # di tengah langkah terakhir itu, sesudah SEMUA langkah lain lulus (0 gagal): bukan uji yang gagal, batasnya yang habis. 20 menit = ruang
    # untuk paket berikutnya, dan uji yang macet tetap dihentikan jauh sebelum batas bawaan GitHub (6 jam).
    # 16 Nov 2026: 20 → 30. Lima run terakhir 14–19 menit; run 43832952189 (merge PR #132) dihentikan di 20 menit 11 detik tanpa satu langkah
    # pun gagal → terbitan Pages ikut batal dan perubahan yang sudah di-merge tidak tayang. 30 menit = ruang ±50% di atas run terlama.
    # 18 Nov 2026: 30 → 45. Terbitan merge PR #145 (run 44313791350, percobaan 2) mendapat runner macOS arm64 yang 2–3× lebih lambat (GitHub:
    # "capacity constraints"): 30 menit 14 detik, dihentikan di langkah terakhir tanpa satu langkah pun gagal. Run normal ±19 menit.
    timeout-minutes: 45
    # 22 Nov 2026: 102 langkah dibagi TIGA job paralel (dulu satu job berurutan 14–21 menit). Tiap langkah punya `if: matrix.bagian == N` — bagian dipilih
    # dari durasi nyata run PR #171 supaya seimbang (±6 menit per bagian); langkah tag sistem-lama + uji dokumen sisa wajib satu bagian. Langkah baru WAJIB
    # diberi `if:` — dijaga alat-uji/periksa_ci.py (tanpa `if:` = jalan di ketiga bagian). 3 + 2 (uji-peramban) = 5 = batas runner macOS gratis sekaligus.
    strategy:
      fail-fast: false
      matrix:
        bagian: [1, 2, 3]
    steps:
      - name: Ambil isi repo
        uses: actions/checkout@v4

      # 3 Okt 2026 (owner: sistem lama & kasir.html "bumi hanguskan"): index.html & kasir.html di akar kini halaman PENGALIH tanpa script ke baru/
      # (versi terakhirnya di tag git sistem-lama-terakhir). Langkah yang dulu memeriksa index.html dipindah ke kasir darurat atau dihapus:
      #   · periksa.sh & lingkup.py → kasir-darurat-nominal.html (satu-satunya halaman kasir yang hidup)
      #   · harness jsc (alat-uji/harness, dua langkah) DIHAPUS — objeknya hilang: ia mengevaluasi modul index.html. /baru/ dievaluasi di jsc lewat
      #     bundel_baru di tiap uji_*_baru, kasir darurat dimuat di Chrome sungguhan di job uji-peramban.
      #   · pindah_mesin.py --periksa DIHAPUS — sumber kebenaran mesin beku kini baru/js/mesin/beku.js + pembantu.js, dijaga beku2.py --sidik.
      - name: "Kasir darurat — sintaks script, lantai Chrome 80, id ganda, handler sebaris (huruf besar/kecil, tanpa kutip; ber-CSP = gagal), getElementById, batas gerak (dulu index.html, pensiun 3 Okt)"
        if: matrix.bagian == 1
        run: alat-uji/periksa.sh kasir-darurat-nominal.html

      - name: "Pembagian CI (owner 22 Nov 2026): tiap langkah uji / uji-peramban punya tepat satu bagian yang ada di matriks, tag + dokumen sisa satu bagian, push hanya main, gladi 4 skenario + 3 kelompok kontrol + kontrol"
        if: matrix.bagian == 1
        run: python3 alat-uji/periksa_ci.py && python3 alat-uji/periksa_ci.py --kontrol

      - name: "periksa.sh — kontrol positif (salinan rusak wajib gagal, halaman tanpa script ditolak)"
        if: matrix.bagian == 2
        run: alat-uji/periksa.sh --kontrol

      - name: "26 mesin uang beku (beku.js) + 55 fungsi & 36 konstanta pembantu (pembantu.js) — byte-identik dengan sidik kanonik"
        if: matrix.bagian == 2
        run: python3 alat-uji/beku2.py --sidik

      - name: beku2 — uji diri (alat terbukti melihat perubahan)
        if: matrix.bagian == 3
        run: python3 alat-uji/beku2.py --uji-diri

      - name: "Lingkup statis kasir darurat — nama dipanggil tanpa deklarasi"
        if: matrix.bagian == 2
        run: python3 alat-uji/lingkup.py kasir-darurat-nominal.html

      - name: Lingkup statis — kontrol positif
        if: matrix.bagian == 2
        run: python3 alat-uji/lingkup.py --kontrol

      - name: "Pensiun sistem lama & kasir.html (3 Okt): pengalih ada, FILES service worker = berkas yang ada & tanpa kasir.html, langkah CI / seed HawkScan / manifest menunjuk berkas yang ada, /baru/ tanpa tautan sistem lama, 404.html pengalih ke jalur penuh /baru/ (owner 7 Okt) + kontrol"
        if: matrix.bagian == 2
        run: python3 alat-uji/uji_pensiun_sistem_lama.py && python3 alat-uji/uji_pensiun_sistem_lama.py --kontrol

      - name: audit.py masih terkompilasi
        if: matrix.bagian == 2
        run: python3 -m py_compile alat-audit/audit.py

      # ---- SISTEM BARU (baru/) — mulai 19 Sep 2026 ----
      - name: "Sistem baru — fungsi modul lain dipanggil tanpa impor (uji jsc membuang impor) + kontrol positif"
        if: matrix.bagian == 3
        run: python3 alat-uji/periksa_impor.py && python3 alat-uji/periksa_impor.py --kontrol

      - name: "Sistem baru — komentar // di tengah baris tidak menelan kode (1 Okt, simpan Cocokkan jatuh ReferenceError) + kontrol positif"
        if: matrix.bagian == 1
        run: python3 alat-uji/periksa_komentar.py && python3 alat-uji/periksa_komentar.py --kontrol

      - name: "Sistem baru — nama penangan ketukan ganda dalam satu layar (yang belakangan menang diam-diam) + kontrol positif"
        if: matrix.bagian == 3
        run: python3 alat-uji/periksa_penangan_ganda.py && python3 alat-uji/periksa_penangan_ganda.py --kontrol

      - name: "Sistem baru — logika layar Jual (kotak pasir) + kontrol positif"
        if: matrix.bagian == 2
        run: python3 alat-uji/uji_jual_baru.py && python3 alat-uji/uji_jual_baru.py --kontrol
      - name: "Sistem baru — logika layar Ringkasan + kontrol positif"
        if: matrix.bagian == 1
        run: python3 alat-uji/uji_ringkasan_baru.py && python3 alat-uji/uji_ringkasan_baru.py --kontrol
      - name: "Sistem baru — logika layar Stok + kontrol positif"
        if: matrix.bagian == 2
        run: python3 alat-uji/uji_stok_baru.py && python3 alat-uji/uji_stok_baru.py --kontrol
      - name: "Barang masuk — timbang & mutu saat terima (paket brief 9 Okt, butir 6 & 7): isian opsional (kosong = belum ditimbang / tidak dicek, bukan selisih 0), stok/modal/bon tidak berubah, ambang mutu owner → tanda AWAS ikut, koreksi membawa isian, rekap per pemasok menutup (kotak pasir + statis + kontrol)"
        if: matrix.bagian == 3
        run: python3 alat-uji/uji_barang_masuk_baru.py && python3 alat-uji/uji_barang_masuk_baru.py --kontrol
      - name: "Modal FIFO dengan saklar owner (9 Okt): saklar mati = rumus rata-rata persis, lapisan & irisan, nota/adukan/takar/cocokkan berurutan, wadah campuran rata-rata, saklar terjadwal baru berlaku di harinya, catatStok disalin utuh (kotak pasir + kontrol)"
        if: matrix.bagian == 1
        run: python3 alat-uji/uji_modal_fifo_baru.py && python3 alat-uji/uji_modal_fifo_baru.py --kontrol
      - name: "Sistem baru — logika layar Pelanggan + kontrol positif"
        if: matrix.bagian == 1
        run: python3 alat-uji/uji_pelanggan_baru.py && python3 alat-uji/uji_pelanggan_baru.py --kontrol
      - name: "Sistem baru — logika layar Menu & Sistem + kontrol positif"
        if: matrix.bagian == 3
        run: python3 alat-uji/uji_menu_baru.py && python3 alat-uji/uji_menu_baru.py --kontrol
      - name: "Uji logika layar Harga & Pemasok sistem baru (kotak pasir + kontrol)"
        if: matrix.bagian == 3
        run: python3 alat-uji/uji_harga_baru.py && python3 alat-uji/uji_harga_baru.py --kontrol
      - name: "Uji logika layar Uang sistem baru — K1–K6 (kotak pasir + kontrol)"
        if: matrix.bagian == 3
        run: python3 alat-uji/uji_uang_baru.py && python3 alat-uji/uji_uang_baru.py --kontrol
      - name: "Uji logika layar Laporan & Dokumen sistem baru (kotak pasir + kontrol)"
        if: matrix.bagian == 1
        run: python3 alat-uji/uji_laporan_baru.py && python3 alat-uji/uji_laporan_baru.py --kontrol
      - name: "Modul pajak (putaran 24): PPh final perkiraan, omzet luar, setoran, ambang (kotak pasir + kontrol)"
        if: matrix.bagian == 1
        run: python3 alat-uji/uji_pajak_baru.py && python3 alat-uji/uji_pajak_baru.py --kontrol

      - name: "Sistem baru — identitas angka lama vs baru (sisi lama dari tag sistem-lama-terakhir; dilewati di CI: cadangan toko tidak ada di repo, checkout dangkal tanpa tag)"
        if: matrix.bagian == 2
        run: python3 alat-uji/uji_identitas_baru.py

      # ---- PUTARAN 23 — akun per orang ----
      - name: "Sistem baru — akses per orang: akun, pendengar, penjaga kiriman, jejak, salinan antre (kotak pasir + kontrol)"
        if: matrix.bagian == 1
        run: python3 alat-uji/uji_akses_baru.py && python3 alat-uji/uji_akses_baru.py --kontrol
      - name: "Kisi SS2 ditegakkan penjaga (audit 39b no. 22): nego & potongan, hak yang diputar owner, kisi bawaan tanpa tolak palsu — fungsi susun asli (kotak pasir + kontrol)"
        if: matrix.bagian == 2
        run: python3 alat-uji/uji_kisi_ss2.py && python3 alat-uji/uji_kisi_ss2.py --kontrol
      - name: "firestore.rules v7 FINAL (draf) — pemeriksa statis (tanpa payung, kunci periode di tiap koleksi bertanggal, blok per koleksi, owner via email, jalur kasir@ dipangkas jadi kasir darurat saja, uid penulis termasuk stafBuatWadah/stafBuatLahir (39) & stafMintaNego, peran = akses.js, berita acara tutup buku hanya maju — model; v7 = v6 + kirim ulang kasir@ bercap + batu nisan + permintaan nego staf + foto bon + pintu tutup buku 2027, PERSIS daftar ubahan; penafsir rules mini menilai kasus Playground ★) + kontrol"
        if: matrix.bagian == 3
        run: python3 alat-uji/periksa_rules.py && python3 alat-uji/periksa_rules.py --kontrol
      - name: "Bukti server rules v7 — bagian statis (emulator & node HANYA di workflow Uji rules di emulator): kolom Wajib docs/uji-rules-v7.md = model, kasus v6 → v7 yang berbeda = lima ubahan (BEDA_V6), model atas dokumen uji yang digeser ke jam lain (1 Jan 2027, Juni 2027, Jan 2028) = kolom Wajib, jangkar 27 kontrol rules dirusak tepat 1× & model membaliknya, kode ASLI kasir darurat kasir-v33/v32 di server palsu jsc/node (:commit bercap REQUEST_TIME, cara lama PATCH updateMask, v32 PATCH utuh; commit v32 diambil sendiri di checkout dangkal, tak terbaca = DILEWATI bukan ✓) + kontrol"
        if: matrix.bagian == 2
        run: python3 alat-uji/uji_rules_emulator.py --periksa && python3 alat-uji/uji_rules_emulator.py --kontrol
      - name: "Isian lokal (23d): tiap kolom ketik & kunci localStorage layar dijaga penjaga isian — statis + kontrol"
        if: matrix.bagian == 3
        run: python3 alat-uji/uji_isian_lokal.py && python3 alat-uji/uji_isian_lokal.py --kontrol
      - name: "Kiriman bukan-owner & owner (bulan lampau, tanpa / dengan bulan terkunci) — access call per kiriman ≤ 18 (batas Firebase 20, sisa 2) + kontrol"
        if: matrix.bagian == 1
        run: python3 alat-uji/peta_akses.py --kiriman && python3 alat-uji/peta_akses.py --kiriman --kontrol

      # ---- PUTARAN 25 — kunci periode bulanan ----
      - name: "Kunci periode (putaran 25): daftar periksa, kunci/buka, pembalik hari ini, final bulanan, pajak, penjaga pusat, kirim bertahap (kotak pasir + kontrol)"
        if: matrix.bagian == 1
        run: python3 alat-uji/uji_kunci_periode.py && python3 alat-uji/uji_kunci_periode.py --kontrol
      - name: "Denyut per akun (audit 39b no. 23): tablet bergiliran tidak terkunci ke akun pertama, rules perangkatStatus apa adanya, \"sudah tidak dipakai\" menyebut pemegangnya (kotak pasir + kontrol)"
        if: matrix.bagian == 1
        run: python3 alat-uji/uji_denyut_per_akun.py && python3 alat-uji/uji_denyut_per_akun.py --kontrol
      - name: "Tutup buku bertahap (rancangan Okt 2026) + siap 2027 (owner 7 Okt): saldo pembuka per kiriman ≤ 18, lanjut/batal, titik kas 31 Des, periksa ulang; putusan per tanggal hari tanpa tutup hari, g6 minus & kelebihan bayar, tanda buku & rak Jual, modal owner, upah belum dibayar, ringkasan KR1/laju/pelanggan, perkiraan kuota, catatan susulan (kotak pasir + kontrol; asap cadangan lokal dilewati di CI)"
        if: matrix.bagian == 2
        run: python3 alat-uji/uji_tutup_buku_bertahap.py && python3 alat-uji/uji_tutup_buku_bertahap.py --kontrol
      - name: "Paket B siap 2027 (owner 7 Okt): Laporan, Pajak & Dasbor membaca tahun yang sudah ditutup buku — potret di berita acara saat kunci, sebelum = sesudah ritual rupiah demi rupiah (5 Jan & 31 Mar 2027), setoran masa Desember di Januari, pilih tahun Pajak & bawaan Jan–Mar, Beranda & pengingat tahun lalu, Januari tidak 'belum lengkap', Batalkan, tanpa potret ditolak bukan Rp0, omzet tahun lalu & aturan per tahun (kotak pasir + kontrol; asap cadangan lokal dilewati di CI)"
        if: matrix.bagian == 3
        run: python3 alat-uji/uji_potret_tahun.py && python3 alat-uji/uji_potret_tahun.py --kontrol
      - name: "Paket C siap 2027 (7 Okt): kartu Pemeriksaan sesudah tutup buku di Uang › Tutup buku — aplikasi memeriksa sendiri (baris perbandingan beku tanpa catatan susulan / karcis telat, modal pembuka = neraca 31 Des, saldo pembuka & rak Jual & buku 25 kg saat tahun baru dibuka vs catatan hidup 31 Des, pajak dari potret per NTPN, tanpa stok minus, utang & piutang per orang; bon lama yang dibetulkan owner bukan beda); hanya membaca cache, data tak ada / ditolak / tanpa internet / salinan perangkat = belum bisa diperiksa; layar uang.js di jsc (kotak pasir + kontrol; asap cadangan lokal dilewati di CI)"
        if: matrix.bagian == 3
        run: python3 alat-uji/uji_periksa_sesudah.py && python3 alat-uji/uji_periksa_sesudah.py --kontrol
      - name: "Tutup buku 2027 lewat PINTU (owner 7 Okt, K8 pengecualian sempit): tahun berbulan terkunci tetap bisa ditutup — jalankanBuku/jalankanBatal uang.js apa adanya, server tiruan mencatat tiap batch, TIAP batch dinilai teks firestore.rules (penafsir mini; ≤ 18 access call; perkiraan layar = server); catatan bulan terkunci lain tetap ditolak; Batalkan kembali persis; pintu kedaluwarsa & Lanjutkan (kotak pasir + kontrol)"
        if: matrix.bagian == 2
        run: python3 alat-uji/uji_tutup_buku_2027.py && python3 alat-uji/uji_tutup_buku_2027.py --kontrol
      - name: "Belanja sesudah tutup buku (siap 2027 · P4): ringkasan tahun membawa pemasok & pesanan yang sudah datang (disusun fungsi yang sama dengan daftar pemasok) — Harga & Pemasok › Belanja sebelum = sesudah ritual (pemasok di truk, harga & tanggal per merek, muatan, saran, pesan WA, status pesanan, kartu pemasok), juga sesudah kunci & arsip setengah jalan, kedatangan 2027 menang, ringkasan lama tanpa pemasok tetap terbaca, Batalkan, tutup buku 2027 membawa ringkasan 2026; sanggahan: id seperti di toko (ejaan pemasok, susulan), kedatangan Januari sebelum kunci = hanya Stok beras beda (prosedur), langkah Kunci latihan memeriksa ringkasan tahun (kotak pasir + kontrol; asap cadangan lokal dilewati di CI)"
        if: matrix.bagian == 2
        run: python3 alat-uji/uji_belanja_tutup_buku.py && python3 alat-uji/uji_belanja_tutup_buku.py --kontrol

      # ---- PUTARAN 25b — antrean kasir tidak boleh macet ----
      - name: "Batal karcis kasir darurat di /baru/ (25b): bentuk dokumen = mulaiBatalkanTrx sistem lama, alasan wajib, bulan terkunci ditolak (kotak pasir + kontrol)"
        if: matrix.bagian == 3
        run: python3 alat-uji/uji_batal_karcis.py && python3 alat-uji/uji_batal_karcis.py --kontrol
      - name: "Bayar bon dari bulan terkunci WAJIB lolos (25b C): teks rules dicocokkan + model + jalur sistem baru dengan Agustus terkunci (kotak pasir + kontrol)"
        if: matrix.bagian == 1
        run: python3 alat-uji/uji_bayar_bon_terkunci.py && python3 alat-uji/uji_bayar_bon_terkunci.py --kontrol
      - name: "Jam yang tampil (27 Sep): baris rincian karcis = jam karcis asli, jam merinci terpisah; cap waktu digambar WIB bukan UTC — jsc di TZ Asia/Jakarta & UTC + penjaga statis + laporan cadangan + kontrol"
        if: matrix.bagian == 3
        run: python3 alat-uji/uji_jam_tampil.py && python3 alat-uji/uji_jam_tampil.py --kontrol

      - name: "Cetak ESC/POS (putaran T1, Sunmi CPad 80 mm): teks ASCII, baris ≤ lebar kertas, angka rata kanan, kode potong/QR/laci (jsc + kontrol)"
        if: matrix.bagian == 1
        run: python3 alat-uji/uji_escpos.py && python3 alat-uji/uji_escpos.py --kontrol
      - name: "Kode QR di gambar struk: penyusun dibaca balik pembaca mandiri (versi 1–6, delapan topeng), kotak beku yang sudah dibaca pemindai, ukuran & pemasangan (jsc + kontrol)"
        if: matrix.bagian == 1
        run: python3 alat-uji/uji_qr.py && python3 alat-uji/uji_qr.py --kontrol
      - name: "Tanda terima barang masuk untuk supir pemasok: nilai nota tanpa upah bongkar, tunai / bon belum / sebagian / lunas, akun yang tidak membaca pembayaran pemasok tidak mencetak sisa, muat di 80 & 58 mm, dua lembar, pemasangan di Stok (jsc + kontrol)"
        if: matrix.bagian == 2
        run: python3 alat-uji/uji_terima_barang.py && python3 alat-uji/uji_terima_barang.py --kontrol
      - name: "Titipan uang keluar & pesan dari tablet + notifikasi: tablet hanya menitip (bentuk rules v13), owner menyetujui satu pintu (uang bertanggal titipan, betulan tercatat, tanpa dobel), kabar dalam aplikasi, isi push server, service worker (jsc + kontrol)"
        if: matrix.bagian == 3
        run: python3 alat-uji/uji_titipan.py && python3 alat-uji/uji_titipan.py --kontrol
      - name: "Tampilan tablet (owner 23 Nov 2026): push aplikasi tablet (izin, token atas nama akun, segarkan, matikan, diketuk), lonceng kabar & pesan (owner / tablet, angka belum dibuka), isi push jawaban owner, pemasang APK (Firebase, izin notifikasi), dock lipat + layar penuh (jsc + kontrol)"
        if: matrix.bagian == 1
        run: python3 alat-uji/uji_tablet_tampilan.py && python3 alat-uji/uji_tablet_tampilan.py --kontrol
      - name: "Barang masuk & bayar supir dari tablet (owner 22 Nov 2026, rules v15): kedatangan bon + titipan upah bongkar & bayar supir + kabar owner; owner menyetujui ke kedatangan / bon pilihan, bertanggal titipan"
        if: matrix.bagian == 2
        run: python3 alat-uji/uji_masuk_tablet.py && python3 alat-uji/uji_masuk_tablet.py --kontrol

      - name: "Tutup hari dari tablet (owner 22 Nov 2026, rules v16): hitung buta, brankas = hitungan − kembalian owner, owner memakai hitungan di lembar (catatan sesudah hitungan tidak mengubah selisih), hitungan disetujui / dibaca saat Tutup"
        # gabung #171 + #172 (22 Nov 2026): langkah #171 lahir sebelum pembagian CI — diberi bagian sesudah periksa_ci.py berbunyi di main
        if: matrix.bagian == 2
        run: python3 alat-uji/uji_tutup_tablet.py && python3 alat-uji/uji_tutup_tablet.py --kontrol
      - name: "Paket P6 · rutinitas, tutup hari & halaman staf (owner 27 Nov 2026, A82 A119 A143 B116): daftar centang rutin harian/mingguan/bulanan (rutinCek, rules v25: owner + Penjaga laci + karyawan), alarm selisih laci berulang (bawaan 3 berturut / 4 dari 7) + tren + Dasbor, alasan selisih bebas + catatan tablet + ditagih sampai dijelaskan, halaman tugas staf (sama untuk semua) — kotak pasir + statis + kontrol"
