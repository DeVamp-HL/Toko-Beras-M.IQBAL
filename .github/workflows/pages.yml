# Alur kerja Pages — Toko Beras M.IQBAL
# Dipakai sejak 6 Agustus 2026 setelah pembangun bawaan Pages gagal berulang.
# Tidak ada build: berkas di repo disalin apa adanya (satu HTML statis tanpa framework).
#
# Sejak putaran rapi-rapi 0 (13 Sep 2026): job `uji` berjalan di SETIAP push/PR dan
# job `terbitkan` hanya jalan di main SESUDAH `uji` hijau. Sebelumnya setiap push ke main
# langsung terbit ke toko tanpa satu pun langkah uji — dan satu referensi salah lingkup
# pernah tiga kali mematikan seluruh aplikasi (7 Sep 2026).
name: Uji lalu terbitkan Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  uji:
    # macos-latest: jsc (JavaScriptCore) tersedia bawaan — sama dengan mesin pengembang.
    runs-on: macos-latest
    # Batas 10 menit dipasang 13 Sep saat pekerjaan ini masih kecil. Per 7 Okt pekerjaan ini ±6½–10 menit (70-an langkah, tergantung runner;
    # langkah terakhir — Chrome palsu percobaan ulang + kontrolnya — sendiri ±4 menit). PR #113 (run 37529470063) dihentikan di 10 menit 23 detik
    # di tengah langkah terakhir itu, sesudah SEMUA langkah lain lulus (0 gagal): bukan uji yang gagal, batasnya yang habis. 20 menit = ruang
    # untuk paket berikutnya, dan uji yang macet tetap dihentikan jauh sebelum batas bawaan GitHub (6 jam).
    timeout-minutes: 20
    steps:
      - name: Ambil isi repo
        uses: actions/checkout@v4

      # 3 Okt 2026 (owner: sistem lama & kasir.html "bumi hanguskan"): index.html & kasir.html di akar kini halaman PENGALIH tanpa script ke baru/
      # (versi terakhirnya di tag git sistem-lama-terakhir). Langkah yang dulu memeriksa index.html dipindah ke kasir darurat atau dihapus:
      #   · periksa.sh & lingkup.py → kasir-darurat-nominal.html (satu-satunya halaman kasir yang hidup)
      #   · harness jsc (alat-uji/harness, dua langkah) DIHAPUS — objeknya hilang: ia mengevaluasi modul index.html. /baru/ dievaluasi di jsc lewat
      #     bundel_baru di tiap uji_*_baru, kasir darurat dimuat di Chrome sungguhan di job uji-peramban.
      #   · pindah_mesin.py --periksa DIHAPUS — sumber kebenaran mesin beku kini baru/js/mesin/beku.js + pembantu.js, dijaga beku2.py --sidik.
      - name: "Kasir darurat — sintaks script, lantai Chrome 80, id ganda, handler sebaris (huruf besar/kecil, tanpa kutip; ber-CSP = gagal), getElementById, batas gerak (dulu index.html, pensiun 3 Okt)"
        run: alat-uji/periksa.sh kasir-darurat-nominal.html

      - name: "periksa.sh — kontrol positif (salinan rusak wajib gagal, halaman tanpa script ditolak)"
        run: alat-uji/periksa.sh --kontrol

      - name: "26 mesin uang beku (beku.js) + 55 fungsi & 36 konstanta pembantu (pembantu.js) — byte-identik dengan sidik kanonik"
        run: python3 alat-uji/beku2.py --sidik

      - name: beku2 — uji diri (alat terbukti melihat perubahan)
        run: python3 alat-uji/beku2.py --uji-diri

      - name: "Lingkup statis kasir darurat — nama dipanggil tanpa deklarasi"
        run: python3 alat-uji/lingkup.py kasir-darurat-nominal.html

      - name: Lingkup statis — kontrol positif
        run: python3 alat-uji/lingkup.py --kontrol

      - name: "Pensiun sistem lama & kasir.html (3 Okt): pengalih ada, FILES service worker = berkas yang ada & tanpa kasir.html, langkah CI / seed HawkScan / manifest menunjuk berkas yang ada, /baru/ tanpa tautan sistem lama, 404.html pengalih ke jalur penuh /baru/ (owner 7 Okt) + kontrol"
        run: python3 alat-uji/uji_pensiun_sistem_lama.py && python3 alat-uji/uji_pensiun_sistem_lama.py --kontrol

      - name: audit.py masih terkompilasi
        run: python3 -m py_compile alat-audit/audit.py

      # ---- SISTEM BARU (baru/) — mulai 19 Sep 2026 ----
      - name: "Sistem baru — fungsi modul lain dipanggil tanpa impor (uji jsc membuang impor) + kontrol positif"
        run: python3 alat-uji/periksa_impor.py && python3 alat-uji/periksa_impor.py --kontrol

      - name: "Sistem baru — komentar // di tengah baris tidak menelan kode (1 Okt, simpan Cocokkan jatuh ReferenceError) + kontrol positif"
        run: python3 alat-uji/periksa_komentar.py && python3 alat-uji/periksa_komentar.py --kontrol

      - name: "Sistem baru — nama penangan ketukan ganda dalam satu layar (yang belakangan menang diam-diam) + kontrol positif"
        run: python3 alat-uji/periksa_penangan_ganda.py && python3 alat-uji/periksa_penangan_ganda.py --kontrol

      - name: "Sistem baru — logika layar Jual (kotak pasir) + kontrol positif"
        run: python3 alat-uji/uji_jual_baru.py && python3 alat-uji/uji_jual_baru.py --kontrol
      - name: "Sistem baru — logika layar Ringkasan + kontrol positif"
        run: python3 alat-uji/uji_ringkasan_baru.py && python3 alat-uji/uji_ringkasan_baru.py --kontrol
      - name: "Sistem baru — logika layar Stok + kontrol positif"
        run: python3 alat-uji/uji_stok_baru.py && python3 alat-uji/uji_stok_baru.py --kontrol
      - name: "Sistem baru — logika layar Pelanggan + kontrol positif"
        run: python3 alat-uji/uji_pelanggan_baru.py && python3 alat-uji/uji_pelanggan_baru.py --kontrol
      - name: "Sistem baru — logika layar Menu & Sistem + kontrol positif"
        run: python3 alat-uji/uji_menu_baru.py && python3 alat-uji/uji_menu_baru.py --kontrol
      - name: "Uji logika layar Harga & Pemasok sistem baru (kotak pasir + kontrol)"
        run: python3 alat-uji/uji_harga_baru.py && python3 alat-uji/uji_harga_baru.py --kontrol
      - name: "Uji logika layar Uang sistem baru — K1–K6 (kotak pasir + kontrol)"
        run: python3 alat-uji/uji_uang_baru.py && python3 alat-uji/uji_uang_baru.py --kontrol
      - name: "Uji logika layar Laporan & Dokumen sistem baru (kotak pasir + kontrol)"
        run: python3 alat-uji/uji_laporan_baru.py && python3 alat-uji/uji_laporan_baru.py --kontrol
      - name: "Modul pajak (putaran 24): PPh final perkiraan, omzet luar, setoran, ambang (kotak pasir + kontrol)"
        run: python3 alat-uji/uji_pajak_baru.py && python3 alat-uji/uji_pajak_baru.py --kontrol

      - name: "Sistem baru — identitas angka lama vs baru (sisi lama dari tag sistem-lama-terakhir; dilewati di CI: cadangan toko tidak ada di repo, checkout dangkal tanpa tag)"
        run: python3 alat-uji/uji_identitas_baru.py

      # ---- PUTARAN 23 — akun per orang ----
      - name: "Sistem baru — akses per orang: akun, pendengar, penjaga kiriman, jejak, salinan antre (kotak pasir + kontrol)"
        run: python3 alat-uji/uji_akses_baru.py && python3 alat-uji/uji_akses_baru.py --kontrol
      - name: "Kisi SS2 ditegakkan penjaga (audit 39b no. 22): nego & potongan, hak yang diputar owner, kisi bawaan tanpa tolak palsu — fungsi susun asli (kotak pasir + kontrol)"
        run: python3 alat-uji/uji_kisi_ss2.py && python3 alat-uji/uji_kisi_ss2.py --kontrol
      - name: "firestore.rules v6 (draf) — pemeriksa statis (tanpa payung, kunci periode di tiap koleksi bertanggal, blok per koleksi, owner via email, jalur kasir@, uid penulis termasuk stafBuatWadah/stafBuatLahir (39), peran = akses.js, berita acara tutup buku hanya maju — model) + kontrol"
        run: python3 alat-uji/periksa_rules.py && python3 alat-uji/periksa_rules.py --kontrol
      - name: "Isian lokal (23d): tiap kolom ketik & kunci localStorage layar dijaga penjaga isian — statis + kontrol"
        run: python3 alat-uji/uji_isian_lokal.py && python3 alat-uji/uji_isian_lokal.py --kontrol
      - name: "Kiriman bukan-owner & owner (bulan lampau, tanpa / dengan bulan terkunci) — access call per kiriman ≤ 18 (batas Firebase 20, sisa 2) + kontrol"
        run: python3 alat-uji/peta_akses.py --kiriman && python3 alat-uji/peta_akses.py --kiriman --kontrol

      # ---- PUTARAN 25 — kunci periode bulanan ----
      - name: "Kunci periode (putaran 25): daftar periksa, kunci/buka, pembalik hari ini, final bulanan, pajak, penjaga pusat, kirim bertahap (kotak pasir + kontrol)"
        run: python3 alat-uji/uji_kunci_periode.py && python3 alat-uji/uji_kunci_periode.py --kontrol
      - name: "Denyut per akun (audit 39b no. 23): tablet bergiliran tidak terkunci ke akun pertama, rules perangkatStatus apa adanya, \"sudah tidak dipakai\" menyebut pemegangnya (kotak pasir + kontrol)"
        run: python3 alat-uji/uji_denyut_per_akun.py && python3 alat-uji/uji_denyut_per_akun.py --kontrol
      - name: "Tutup buku bertahap (rancangan Okt 2026) + siap 2027 (owner 7 Okt): saldo pembuka per kiriman ≤ 18, lanjut/batal, titik kas 31 Des, periksa ulang; putusan per tanggal hari tanpa tutup hari, g6 minus & kelebihan bayar, tanda buku & rak Jual, modal owner, upah belum dibayar, ringkasan KR1/laju/pelanggan, perkiraan kuota, catatan susulan (kotak pasir + kontrol; asap cadangan lokal dilewati di CI)"
        run: python3 alat-uji/uji_tutup_buku_bertahap.py && python3 alat-uji/uji_tutup_buku_bertahap.py --kontrol
      - name: "Paket B siap 2027 (owner 7 Okt): Laporan, Pajak & Dasbor membaca tahun yang sudah ditutup buku — potret di berita acara saat kunci, sebelum = sesudah ritual rupiah demi rupiah (5 Jan & 31 Mar 2027), setoran masa Desember di Januari, pilih tahun Pajak & bawaan Jan–Mar, Beranda & pengingat tahun lalu, Januari tidak 'belum lengkap', Batalkan, tanpa potret ditolak bukan Rp0, omzet tahun lalu & aturan per tahun (kotak pasir + kontrol; asap cadangan lokal dilewati di CI)"
        run: python3 alat-uji/uji_potret_tahun.py && python3 alat-uji/uji_potret_tahun.py --kontrol
      - name: "Paket C siap 2027 (8 Okt): kartu Pemeriksaan sesudah tutup buku di Uang › Tutup buku — aplikasi memeriksa sendiri (baris perbandingan beku, modal pembuka = neraca 31 Des, saldo pembuka & rak Jual & buku 25 kg saat tahun baru dibuka, pajak dari potret, tanpa stok minus, utang & piutang); hanya membaca cache, data tak ada = belum bisa diperiksa; layar uang.js di jsc (kotak pasir + kontrol; asap cadangan lokal dilewati di CI)"
        run: python3 alat-uji/uji_periksa_sesudah.py && python3 alat-uji/uji_periksa_sesudah.py --kontrol

      # ---- PUTARAN 25b — antrean kasir tidak boleh macet ----
      - name: "Batal karcis kasir darurat di /baru/ (25b): bentuk dokumen = mulaiBatalkanTrx sistem lama, alasan wajib, bulan terkunci ditolak (kotak pasir + kontrol)"
        run: python3 alat-uji/uji_batal_karcis.py && python3 alat-uji/uji_batal_karcis.py --kontrol
      - name: "Bayar bon dari bulan terkunci WAJIB lolos (25b C): teks rules dicocokkan + model + jalur sistem baru dengan Agustus terkunci (kotak pasir + kontrol)"
        run: python3 alat-uji/uji_bayar_bon_terkunci.py && python3 alat-uji/uji_bayar_bon_terkunci.py --kontrol
      - name: "Jam yang tampil (27 Sep): baris rincian karcis = jam karcis asli, jam merinci terpisah; cap waktu digambar WIB bukan UTC — jsc di TZ Asia/Jakarta & UTC + penjaga statis + laporan cadangan + kontrol"
        run: python3 alat-uji/uji_jam_tampil.py && python3 alat-uji/uji_jam_tampil.py --kontrol

      # ---- PUTARAN 25c — pindahan terakhir: jenis beras, operator & PIN ke /baru/ (katalog kasir: job uji-peramban) ----
      - name: "Setelan jenis beras di /baru/ (25c): aturan = sistem lama (terkunci sidik pembantu.sha256), dokumen sama (kunci dibekukan dari tag), dokumen menang atas salinan HP, tampil di Harga + Stok + Jual (kotak pasir + kontrol)"
        run: python3 alat-uji/uji_setelan_jenis_beras.py && python3 alat-uji/uji_setelan_jenis_beras.py --kontrol
      - name: "Operator kasir & PIN (25c; owner 7 Okt: tab Kasir & PIN dicabut dari Menu, tidak ada layar yang menulis dokumennya): bentuk dokumen tanpa PIN operator, PIN owner bentuk sama (SHA-256 = hashlib, acakPin terkunci sidik) (kotak pasir + kontrol)"
        run: python3 alat-uji/uji_operator_pin.py && python3 alat-uji/uji_operator_pin.py --kontrol

      # ---- PUTARAN 27 — stok & merek (owner 27 Sep) ----
      - name: "Cocokkan dipisah (27 · Bagian 1): tumpukan gudang = karung utuh, wadah = isi kotak + karung terbuka dibagi ke merek asal, susut wajar batas owner, isi ulang lupa ditawarkan, rantai stok tidak bergeser (kotak pasir + kontrol)"
        run: python3 alat-uji/uji_cocokkan_terpisah.py && python3 alat-uji/uji_cocokkan_terpisah.py --kontrol
      - name: "Varian merek per belanja (27 · Bagian 2): harga beli beda > batas owner wajib dijawab sama/beda mutu, varian = nama sendiri, kolam lama tidak disentuh, jenis ikut induk, harga varian terbit sendiri (kotak pasir + kontrol)"
        run: python3 alat-uji/uji_varian_merek.py && python3 alat-uji/uji_varian_merek.py --kontrol
      - name: "Arsip produk (27 · Bagian 3): hanya yang habis, hilang dari Jual/katalog/label/katalog HP kasir (= penyusun sistem lama, terkunci sidik, minus arsip), laporan & buku tetap, hapus hanya tanpa transaksi, barang masuk bertanya pulihkan/varian (kotak pasir + kontrol)"
        run: python3 alat-uji/uji_arsip_produk.py && python3 alat-uji/uji_arsip_produk.py --kontrol
      - name: "Setengah karung (27 · Bagian 4): kemasan 50 kg dijual ½ lewat jalur pemecah Adukan di kiriman yang sama, modal dipindah utuh, stok 50 −1 & 25 +2 −1, harga 25 kg katalog/usul, batal mencabut pemecah (kotak pasir + kontrol)"
        run: python3 alat-uji/uji_setengah_karung.py && python3 alat-uji/uji_setengah_karung.py --kontrol
      - name: "Wadah bernama (27 · Bagian 5): harga liter melekat pada wadah, literan wadah memotong buku merek asal sebanding komposisi (baris internal per merek, struk satu baris), HPP rata-rata isi, identitas rantai stok, katalog tidak menagih liter merek lewat-wadah, nama kelas ditolak barang masuk, ganti nama wadah (kotak pasir + kontrol)"
        run: python3 alat-uji/uji_wadah_bernama.py && python3 alat-uji/uji_wadah_bernama.py --kontrol
      - name: "Wadah punya stok sendiri (28): buku 'Wadah <nama>' lahir lewat batch stokAwal 0 kg, pindahan awal tidak menggeser nilai/laba/tumpukan, takar memindah buku karung → wadah, literan cuma memotong buku wadah, cocokkan = susut wadah, ganti nama membawa stok, katalog HP kasir, tiga pintu karung, tidak bocor ke daftar merek (kotak pasir + kontrol)"
        run: python3 alat-uji/uji_wadah_stok_sendiri.py && python3 alat-uji/uji_wadah_stok_sendiri.py --kontrol
      - name: "Buku per ukuran (28): karung 25 kg merek dua ukuran dibukukan ke 'Merek 25 kg', pisah stok lama dengan hitungan karung, rak/retur/katalog kasir/harga dari buku ukurannya (kotak pasir + kontrol)"
        run: python3 alat-uji/uji_buku_ukuran.py && python3 alat-uji/uji_buku_ukuran.py --kontrol
      # ---- PUTARAN 29 — uang: biaya karyawan, upah per orang, bayar pemasok lewat transfer (owner 27 Sep) ----
      - name: "Tiga tujuan uang keluar & kartu Laba kotor → ke mana (29 · Bagian 1 & 3): 'untuk karyawan' tetap biaya toko di laba, catatan lama = belum dipilah, kartu menjumlah persis ke laba kotor & laba bersih mesin, ASAP GLOBAL laba tiap bulan byte-sama dengan main (kotak pasir + kontrol)"
        run: python3 alat-uji/uji_uang_karyawan.py && python3 alat-uji/uji_uang_karyawan.py --kontrol
      - name: "Upah per orang (29 · Bagian 2): tarif per hari menurut tanggal berlaku, harian/mingguan/bulanan dibulatkan dulu, gajian dua orang berbeda, slip merinci tiap ruas tarif, riwayat tidak ditulis ulang, entri cacat ditolak (kotak pasir + kontrol)"
        run: python3 alat-uji/uji_upah_per_orang.py && python3 alat-uji/uji_upah_per_orang.py --kontrol
      - name: "Bayar bon pemasok tunai/transfer (29 · Bagian 4): rekening ikut turun, biaya admin = uang keluar untuk toko dari rekening satu kiriman, utang turun sebesar nominal bayar, kantong yang dipilih dijaga, rekening belum diisi → catat isi rekening (kotak pasir + kontrol)"
        run: python3 alat-uji/uji_bayar_pemasok_transfer.py && python3 alat-uji/uji_bayar_pemasok_transfer.py --kontrol
      # ---- owner 7 Okt 2026 (paket E-2): pembetulan bon pemasok berjejak + foto kertas bon ----
      - name: "Pembetulan bon pemasok (owner 7 Okt): pindah pembayaran ke bon lain / jumlah pembayaran / nomor bon / bon lama — dokumen yang sama ditulis ulang dengan riwayat & alasan wajib, utang total & kas & laba tetap saat pindah, kelebihan disebut, jumlah BESAR dua ketukan, tanggal bon lama pemilih tanggal, bon yang datang sesudah pembayaran ditolak, bulan terkunci ditolak (kotak pasir + statis + kontrol)"
        run: python3 alat-uji/uji_pembetulan_bon.py && python3 alat-uji/uji_pembetulan_bon.py --kontrol
      - name: "Foto bon (owner 7 Okt): pengecil di perangkat (≤ 1600 px, JPEG 0,6 → turun, ≤ 300 KB, batas 700 KB) & penyimpan satu dokumen per foto diuji dengan kanvas tiruan; koleksi fotoBon tidak didengar, dibaca sekali per bon, tanpa salinan antre lokal; foto yang menunggu server dibatasi & tidak disebut tersimpan; CSP img-src data:/blob: (jsc + statis + kontrol)"
        run: python3 alat-uji/uji_foto_bon.py && python3 alat-uji/uji_foto_bon.py --kontrol
      # ---- PUTARAN 30 — harga beli per kelas mutu (owner 28 Sep): peta merek → kelas = lapisan baca; kelas tanpa wadah = buku atas nama kelas + merkPemasok ----
      - name: "Kelas mutu merek (30): peta baca/tulis, tebakan tiga sumber, riwayat kelas = riwayatModal, harga lalu kelas per pemasok & batch dikoreksi, ▲▼= & kalimat lunak tidak memblokir, simpan satu kiriman + tebakan tercatat sebagai tebakan, kelas tanpa wadah = buku kelas + merkPemasok & mesin mengabaikannya, kartu per bulan tertimbang & kalimat periode, ganti nama wadah membawa peta (kotak pasir + statis + kontrol)"
        run: python3 alat-uji/uji_kelas_merek.py && python3 alat-uji/uji_kelas_merek.py --kontrol
      # ---- PUTARAN 31 — pemantapan serah terima 28 Sep: karcis bertanya nama seharga (31.1), penjaga catatan bertanggal mundur (31.3) ----
      - name: "Pemantapan 31: rinci karcis bertanya nama kalau harganya sama (tidak memilih diam-diam); barang masuk & adukan bertanggal sebelum cocokkan terakhir ditanya dua ketukan dengan tanggalnya (kotak pasir + statis + kontrol)"
        run: python3 alat-uji/uji_pemantapan_31.py && python3 alat-uji/uji_pemantapan_31.py --kontrol
      - name: "Jual dulu, tandai untuk dicocokkan (31b): pemeriksaan ulang stok tidak berubah, staf ditahan, owner dua ketukan dengan nama & kg, baris bertanda perluCocokkan + selisihKg, buku minus, tuntas = cocokkan bertanggal ≥ nota, pita Jual & kartu keempat Gudang (kotak pasir + statis + kontrol)"
        run: python3 alat-uji/uji_jual_tandai_cocok.py && python3 alat-uji/uji_jual_tandai_cocok.py --kontrol
      - name: "Riwayat penjualan (32): semua nota per hari dengan kunci panel Hari ini, batal/dirinci disembunyikan, total nota − uang retur = omzet mesin laporan, saringan periode/jenis/cara/cari, halaman 50, struk & retur lewat jalur yang ada (kotak pasir + statis + kontrol)"
        run: python3 alat-uji/uji_riwayat_penjualan.py && python3 alat-uji/uji_riwayat_penjualan.py --kontrol
      - name: "Gerbang masuk G4, kinerja & gerak (33): preload = graf impor app.js, gambar ulang digabung sekali per bingkai (jsc, jam palsu), layar tersembunyi hanya ditandai kotor, gerbang tanpa rupiah & ID formulir utuh, penutup omzet ditahan sebelum menulis"
        run: python3 alat-uji/uji_kinerja_gerak.py && python3 alat-uji/uji_kinerja_gerak.py --kontrol
      - name: "Rapi-rapi tata letak Jual (34): tirai lembar selayar (tidak mewarisi lebar), kabar hanya di kolom rak, kartu rak menurut lebar rak, lembar di atas kolomnya, panggung di kolom keranjang, pita status hanya tanpa internet / ditolak (jsc)"
        run: python3 alat-uji/uji_tata_letak_jual.py && python3 alat-uji/uji_tata_letak_jual.py --kontrol
      - name: "Rapi-rapi tata letak Ringkasan & Stok (35): tombol kerja Stok di atas / kolom kanan menempel, jawaban dua kolom urut ke bawah, formulir tetap 1180, kartu samping Ringkasan satu kolom, lebar Mac seragam 1720"
        run: python3 alat-uji/uji_tata_letak_ringkasan_stok.py && python3 alat-uji/uji_tata_letak_ringkasan_stok.py --kontrol
      - name: "Rapi-rapi tata letak layar lain (36): tujuh layar kerja di Mac selebar 1720 & berpinggir sama, kolom samping tiga-kolom clamp(vw) (1280 tidak menyempit), Menu tetap kolom N1 860"
        run: python3 alat-uji/uji_tata_letak_layar_lain.py && python3 alat-uji/uji_tata_letak_layar_lain.py --kontrol
      - name: "CSP /baru/ (keputusan owner 1 Okt: Pasang) + kasir darurat (3 Okt, kasir-v32: hash saja, koneksi persis Firebase REST, data-aksi ↔ penangan) + pengalih (index, kasir, 404 — 7 Okt): meta sebelum script, hash script sebaris = isinya, tanpa onclick sebaris"
        run: python3 alat-uji/uji_csp.py && python3 alat-uji/uji_csp.py --kontrol
      - name: "Audit 39b no. 28: kabar sesudah kiriman jujur — antre = \"Tersimpan di perangkat, menunggu server\" di enam layar + Jual (panel wadah, umum, setelan, pesanan, tarik balik, batal nota) + kiriman bertahap; pil kepala menyebut yang DITOLAK server (jsc)"
        run: python3 alat-uji/uji_kabar_antre.py && python3 alat-uji/uji_kabar_antre.py --kontrol
      # ---- PUTARAN 38 — kendali biaya (cost controlling) di Laporan › Biaya ----
      - name: "Kendali biaya (38): tiap catatan uang keluar jatuh ke tepat satu jenis (tanda → untuk → kata owner → kata bawaan → lain), Σ jenis menutup ke mesin laba, anggaran owner + lampu (jatah hari ke-N, upah belum dibayar ikut), acuan median terukur, titik impas dari omzet ber-HPP & mesin sampai hari ini, pemicu per satuan (arah dibalik untuk jual/margin), pareto 80 %, peringatan menunjuk pintu, tren, atur & tambah kata satu-kata-satu-jenis; ASAP GLOBAL laba tiap bulan byte-sama dengan main (kotak pasir + kontrol)"
        run: python3 alat-uji/uji_kendali_biaya.py && python3 alat-uji/uji_kendali_biaya.py --kontrol
      # ---- PUTARAN 39 — wadah literan satu buku per kotak (owner 29 Sep): karung belakang = buku sendiri, isi ulang tiga ketukan, aktivasi per wadah, cek wadah; rules v5 ----
      - name: "Wadah satu buku per kotak (39): karung di belakang wadah = buku sendiri (buka = pindah merek → karung belakang, tuang = pindah karung belakang → wadah, kolam vs buku disebut), isi ulang tiga ketukan 1 karung / ½ / kg satu kiriman & batas menggunung, buku merek kurang → tolak + tandai untuk dicocokkan (perluCocokkan + selisihPerMerk, tuntas = cocokkan bertanggal ≥ dokumen), aktivasi per wadah dari daftar tanpa menggeser nilai/laba/tumpukan, komposisi turunan & banding, cek tutup toko (dikosongkan = sisihkan tanpa timbang), selisih dua angka disebut; penjaga perangkat = rules v5 (kotak pasir + kontrol)"
        run: python3 alat-uji/uji_wadah_satu_buku.py && python3 alat-uji/uji_wadah_satu_buku.py --kontrol
      - name: "Karung bekas dari karung habis (owner 7 Okt): karung di belakang wadah yang habis lewat isi ulang / − + takar / buka karung / hapus karung habis / samakan / cocokkan = +1 karung bekas di kiriman yang sama, sekali per karung, dicabut DI kiriman yang membuatnya berdiri lagi; pencabutan = hapus kelahiran hari ini atau catatan pembalik hari ini (bulan terkunci tidak ditolak, laba bulan lalu tetap); dua sisi neraca = laba; nilai = setelan owner (bawaan 15 Sep) diterapkan ke buku dua ketukan; bukan-owner dititip; Jual meneruskan r.hapus (kotak pasir + statis + kontrol)"
        run: python3 alat-uji/uji_karung_bekas_lahir.py && python3 alat-uji/uji_karung_bekas_lahir.py --kontrol
      - name: "Audit 39b no. 29: rak Literan (Jual) & tab Wadah literan (Stok) tidak menghitung ulang komposisi turunan / selisih / cek wadah / buku semua wadah tiap ketukan atau huruf, tapi data baru, keranjang Jual, atau tanggal berganti = dihitung ulang (berkas layar asli di jsc, tanpa peramban; kotak pasir + kontrol)"
        run: python3 alat-uji/uji_cache_chip_literan.py && python3 alat-uji/uji_cache_chip_literan.py --kontrol
      # ---- owner 3 Okt: "Gua mau layar jual lebih smooth" — rak Jual disusun inkremental ----
      - name: "Rak Jual inkremental (owner 3 Okt): sesudah tiap ubahan keranjang / struk parkir, susunRakLanjut = susunRak persis (urutan, kelompok, Sering, rak Wadah, isian berat) — kasus tepi bernama + urutan acak berbenih tetap, hanya chip yang terpengaruh dihitung ulang; layar Jual asli: ubahan keranjang → lanjutan, data / pelanggan / tukar → penuh, HTML tiap jalur = susun penuh (kotak pasir + kontrol)"
        run: python3 alat-uji/uji_rak_inkremental.py && python3 alat-uji/uji_rak_inkremental.py --kontrol
      # ---- owner 7 Okt: paket Jual — batas nego per orang (JS2-C), keranjang bertahan saat dimuat ulang, simpan nota lebih cepat ----
      - name: "Batas nego per orang (JS2-C, owner 7 Okt): jatah % margin per peran & akun (owner 100 · Ben 50 · karyawan 0, setelan owner), batas naik ke langkah, di bawah jatah minta owner (harga nota tetap), di bawah modal hanya yang diizinkan + alasan, persetujuan owner sekali pakai, tiap nego tercatat di nota, penjaga kiriman Ben, Buku Nego, Atur (kotak pasir + kontrol)"
        run: python3 alat-uji/uji_jual_nego.py && python3 alat-uji/uji_jual_nego.py --kontrol
      - name: "Keranjang & struk parkir bertahan saat halaman dimuat ulang (owner 7 Okt): penyimpanan sesi per akun + hari ini, tanpa tukar/karcis/nota terakhir/uang, akun lain & hari lain dibuang, cermin stok ikut, dibersihkan sesudah nota & ganti orang, mode privat tidak jatuh (layar Jual asli di jsc + kontrol)"
        run: python3 alat-uji/uji_keranjang_tahan.py && python3 alat-uji/uji_keranjang_tahan.py --kontrol
      - name: "Simpan nota lebih cepat (owner 7 Okt): rak identitas = rak penuh tanpa sisa; pembanding dokumen nota cara baru vs lama byte-sama (karung, kemasan + bonus + nego, literan wadah, repack, wadah, ½ karung, bon, bayar sebagian, tembus); panggilan buku stok jauh lebih sedikit (kotak pasir + kontrol)"
        run: python3 alat-uji/uji_catat_nota_cepat.py && python3 alat-uji/uji_catat_nota_cepat.py --kontrol
      # ---- owner 3 Okt: "masih ada lag atau patah-patah" — layar SELAIN Jual: ingatan per versi cache, hitung sekali per gambar ----
      - name: "Layar lain mulus (owner 3 Okt): tujuh layar asli di jsc (pemuat modul ES) — tiap gambar DENGAN ingatan = TANPA ingatan byte-sama, hasil ingatan dibekukan tanpa galat, fungsi yang diingat = hitung ulang penuh (nota baru, cache sementara, titik kas perangkat, ganti hari & bulan), dasbor = Ringkasan segar, ongkos per ketukan (kotak pasir + kontrol)"
        run: python3 alat-uji/uji_layar_mulus.py && python3 alat-uji/uji_layar_mulus.py --kontrol
      # ---- owner 3 Okt: /baru/ dipakai sebagai web app Safari (Mac) + Safari iPhone/iPad — cacat khas WebKit ----
      - name: "Safari/WebKit (owner 3 Okt): sandi tidak terkunci selagi fokus & dilepas di pointerdown, jarak poni tiap layar, :hover menu samping hanya untuk kursor, tanpa kolom bulan, touchstart pasif (:active iOS), penjaga muat-ulang modul kenal kalimat Safari, jarak aman kiri/kanan, minus di #rtSelisih, WA/cetak Laporan dibuka di ketukan lalu nomornya dicatat; owner 7 Okt: WA Uang & Harga tanpa noopener, paket bank dicetak di ketukan, :hover semua stylesheet hanya untuk kursor (statis + jsc + kontrol)"
        run: python3 alat-uji/uji_safari_webkit.py && python3 alat-uji/uji_safari_webkit.py --kontrol
      # ---- owner 7 Okt: paket dokumen & sisa (D1 pusat dokumen yang kurang · D3 sisa pensiun sistem lama). D2 Safari ikut langkah di atas
      #      (WA Uang/Harga, paket bank, :hover semua stylesheet); 404.html di uji_csp & uji_pensiun_sistem_lama; tab Kasir & PIN di uji_operator_pin ----
      # Tinjauan 7 Okt: checkout di atas dangkal & tanpa tag, jadi pencocokan daftar kunci sistem lama dengan tag sistem-lama-terakhir dulu DILEWATI di CI
      # (yang tetap jalan: daftar beku tidak memuat kunci /baru/ & kasir darurat). Tag diambil di sini — satu commit, dangkal; di mesin yang sudah punya
      # tag tidak mengambil apa pun. Sesudahnya uji Dokumen & sisa jalan dengan --wajib-tag: tanpa tag = GAGAL, bukan dilewati diam-diam.
      - name: "Ambil tag sistem-lama-terakhir (satu commit, dangkal) untuk uji Dokumen & sisa — tidak mengambil apa pun kalau tag sudah ada"
        run: git rev-parse -q --verify refs/tags/sistem-lama-terakhir >/dev/null || git fetch --no-tags --depth=1 origin +refs/tags/sistem-lama-terakhir:refs/tags/sistem-lama-terakhir
      - name: "Dokumen & sisa (owner 7 Okt): daftar harga & harga yang naik untuk pelanggan (katalog terbit, riwayat terbit), paket bank bernomor dihitung dulu, jalan pintas kartu piutang (hanya untuk hak Laporan) & daftar harga, bersihkan simpanan sistem lama (daftar beku = tag dikurangi kunci /baru/ & kasir darurat, antrean berisi dijaga sampai berkasnya dinyatakan tersimpan, berkas tanpa PIN owner, dua ketukan, dihitung saat lembar dibuka), peringatan kuota, kalimat 'lewat sistem lama' & jalur berkas di layar (kotak pasir jsc + statis + kontrol; tag wajib ada)"
        run: python3 alat-uji/uji_dokumen_sisa.py --wajib-tag && python3 alat-uji/uji_dokumen_sisa.py --kontrol --wajib-tag
      # ---- GLADI TUTUP BUKU (7 Okt 2026): /baru/ ke server tiruan + data contoh. Emulator & Chrome di workflow gladi-tutup-buku.yml (runner); di sini jsc/statis ----
      - name: "Server tiruan /baru/ (gladi): ?emulator= hanya di halaman localhost, alamat emulator lokal saja, proyek demo bukan toko, emulator disambung sebelum dipakai, CSP situs TIDAK dilonggarkan, bilah SERVER TIRUAN (jsc + statis + kontrol)"
        run: python3 alat-uji/uji_server_tiruan.py && python3 alat-uji/uji_server_tiruan.py --kontrol
      - name: "Data contoh gladi tutup buku dinilai logika /baru/ asli (12 baris sama, gerbang per varian, kiriman bertahap ≤ 18, tanpa minus) + salinan uji gladi statis (+ kontrol)"
        run: python3 alat-uji/gladi_data_contoh.py --periksa && python3 alat-uji/gladi_data_contoh.py --kontrol && python3 alat-uji/gladi_tutup_buku.py --periksa-salinan
      # Keputusan owner 26 Sep: tiap halaman yang dicoba ulang di uji peramban menulis baris "DICOBA ULANG: <nama uji>" + peringatan di ringkasan
      # run. Sering muncul = masalah sungguhan, bukan Chrome yang lambat. Uji ini memakai Chrome PALSU (tanpa Chrome), jadi tempatnya di sini.
      - name: "Percobaan ulang uji peramban WAJIB tercatat: baris DICOBA ULANG + peringatan ringkasan run, selesai-tanpa-DOM ikut diulang, halaman sehat nol baris — Chrome palsu + kontrol"
        run: python3 -u alat-uji/uji_coba_ulang.py && python3 -u alat-uji/uji_coba_ulang.py --kontrol

  # ---- UJI PERAMBAN (25b): semua uji yang menyalakan Chrome headless, BERBARENGAN dengan `uji` ----
  # Di runner macOS satu kali Chrome jauh lebih lambat daripada di Mac pengembang (uji layar kunci saja ±5 menit). Dengan tiga
  # uji peramban + kontrolnya di dalam `uji`, pekerjaan itu melewati batas 10 menitnya (PR #41: dihentikan di kontrol antrean kasir
  # sesudah uji utamanya lulus 60/60). Dipisah supaya batas waktu tiap pekerjaan tetap berarti dan Pages tetap menunggu keduanya.
  uji-peramban:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Ambil isi repo
        uses: actions/checkout@v4

      - name: "Tirai & ganti orang (23c/23d): 0 angka rupiah sebelum masuk, keranjang & isian tujuh layar tidak terbawa ke akun berikutnya — Chrome headless + kontrol (keluar 4 = GAGAL JARINGAN)"
        run: python3 -u alat-uji/uji_layar_kunci.py && python3 -u alat-uji/uji_layar_kunci.py --kontrol
      - name: "Antrean kasir (25b): karcis ditolak server dipisah, sisanya tetap terkirim; 401 → layar masuk; sinyal/429/503 → tetap antre; denyut & versi; tahan muat ulang; tombol sungguhan diketuk di bawah CSP halaman (kanari diblokir, nol pelanggaran) — Chrome headless + Firestore palsu + kontrol"
        run: python3 -u alat-uji/uji_antrean_kasir.py && python3 -u alat-uji/uji_antrean_kasir.py --kontrol
      # uji_sistem_lama_bacasaja.py (25b B: penjaga tulis index.html) DIHAPUS 3 Okt 2026 bersama objeknya — sistem lama pensiun, index.html kini
      # halaman pengalih tanpa script (tidak ada jalan tulis lagi di situs).
      - name: "Katalog kasir dari /baru/ (25c): penyusun = sistem lama (terkunci sidik), kunci dokumen beku, ikut kiriman terbit harga, gerbang terbit, Beranda (kasir.html pensiun diam); HP penjaga mengambil katalog baru tanpa dibuka ulang — statis + jsc + Chrome headless + kontrol"
        run: python3 -u alat-uji/uji_katalog_kasir.py && python3 -u alat-uji/uji_katalog_kasir.py --kontrol

  terbitkan:
    needs: [uji, uji-peramban]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ambil isi repo
        uses: actions/checkout@v4

      - name: Siapkan Pages
        uses: actions/configure-pages@v5

      - name: Bungkus seluruh folder apa adanya
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Terbitkan
        id: deploy
        uses: actions/deploy-pages@v4
