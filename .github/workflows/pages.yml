        run: python3 alat-uji/uji_safari_webkit.py && python3 alat-uji/uji_safari_webkit.py --kontrol
      # ---- owner 7 Okt: paket dokumen & sisa (D1 pusat dokumen yang kurang · D3 sisa pensiun sistem lama). D2 Safari ikut langkah di atas
      #      (WA Uang/Harga, paket bank, :hover semua stylesheet); 404.html di uji_csp & uji_pensiun_sistem_lama; tab Kasir & PIN di uji_operator_pin ----
      # Tinjauan 7 Okt: checkout di atas dangkal & tanpa tag, jadi pencocokan daftar kunci sistem lama dengan tag sistem-lama-terakhir dulu DILEWATI di CI
      # (yang tetap jalan: daftar beku tidak memuat kunci /baru/ & kasir darurat). Tag diambil di sini — satu commit, dangkal; di mesin yang sudah punya
      # tag tidak mengambil apa pun. Sesudahnya uji Dokumen & sisa jalan dengan --wajib-tag: tanpa tag = GAGAL, bukan dilewati diam-diam.
      - name: "Ambil tag sistem-lama-terakhir (satu commit, dangkal) untuk uji Dokumen & sisa — tidak mengambil apa pun kalau tag sudah ada"
        if: matrix.bagian == 1
        run: git rev-parse -q --verify refs/tags/sistem-lama-terakhir >/dev/null || git fetch --no-tags --depth=1 origin +refs/tags/sistem-lama-terakhir:refs/tags/sistem-lama-terakhir
      - name: "Dokumen & sisa (owner 7 Okt): daftar harga & harga yang naik untuk pelanggan (katalog terbit, riwayat terbit), paket bank bernomor dihitung dulu, jalan pintas kartu piutang (hanya untuk hak Laporan) & daftar harga, bersihkan simpanan sistem lama (daftar beku = tag dikurangi kunci /baru/ & kasir darurat, antrean berisi dijaga sampai berkasnya dinyatakan tersimpan, berkas tanpa PIN owner, dua ketukan, dihitung saat lembar dibuka), peringatan kuota, kalimat 'lewat sistem lama' & jalur berkas di layar (kotak pasir jsc + statis + kontrol; tag wajib ada)"
        if: matrix.bagian == 1
        run: python3 alat-uji/uji_dokumen_sisa.py --wajib-tag && python3 alat-uji/uji_dokumen_sisa.py --kontrol --wajib-tag
      # ---- audit kesiapan 2027 · P6 (sanggahan PR #118): dokumen pegangan owner sesudah 13 Okt — angka & keputusan yang tertulis menutup dengan kode ----
      - name: "Dokumen pegangan owner (audit P6): proyeksi kuota tutup buku 2027 (Januari 2028) = rumus kartu Perkiraan kuota dijalankan di jsc (kotak setahun, Januari–November terkunci; 117% = skala catatan 2026 saja), bunyi K11 2028, K9 menyebut kodenya & jalan sementara owner, jalur Menu = laci/baris/tab yang ada, katalog kasir lewat TERBITKAN, kiriman tutup buku ditolak di uji-rules-v7, sandaran 'Agustus tidak pernah dikunci' (statis + jsc + kontrol)"
        if: matrix.bagian == 2
        run: python3 alat-uji/uji_dokumen_owner.py && python3 alat-uji/uji_dokumen_owner.py --kontrol
      # ---- GLADI TUTUP BUKU (7 Okt 2026): /baru/ ke server tiruan + data contoh. Emulator & Chrome di workflow gladi-tutup-buku.yml (runner); di sini jsc/statis ----
      - name: "Server tiruan /baru/ (gladi): ?emulator= hanya di halaman localhost, alamat emulator lokal saja, proyek demo bukan toko, emulator disambung sebelum dipakai, CSP situs TIDAK dilonggarkan, bilah SERVER TIRUAN (jsc + statis + kontrol)"
        if: matrix.bagian == 3
        run: python3 alat-uji/uji_server_tiruan.py && python3 alat-uji/uji_server_tiruan.py --kontrol
      - name: "Data contoh gladi tutup buku dinilai logika /baru/ asli (12 baris sama, gerbang per varian, kiriman bertahap ≤ 18, tanpa minus) + salinan uji gladi statis (+ kontrol)"
        if: matrix.bagian == 1
        run: python3 alat-uji/gladi_data_contoh.py --periksa && python3 alat-uji/gladi_data_contoh.py --kontrol && python3 alat-uji/gladi_tutup_buku.py --periksa-salinan
      # ---- owner 7 Okt 2026 (siap 2027): HEMAT BACA tahap 1–2 — saklar bawaan MATI; rules v7, cap jam server di tiap tulisan koleksi hemat, batu nisan ----
      - name: "Hemat baca (owner 7 Okt): hari kuota Pasifik (reset 14.00/15.00 WIB), tanda air per koleksi per perangkat dari cap SERVER, batu nisan, baca penuh harian per toko, penulis tanpa cap, pendeteksi + sentuh, rem kuota, kunci tab, pendengar simpanan hidup — server mainan (jam perangkat mundur/maju, perangkat absen > 14 hari, hapus dalam/luar jendela delta); firebase.js saklar MATI = pendengar sebelum 7 Okt, cap hanya koleksi hemat, nisan hanya sesudah aturan v7; SETIAP jalan tulis bercap atau beralasan; kasir darurat :commit + REQUEST_TIME, ditolak → cara lama PATCH updateMask (rules v3/v6/v7); tinjauan 7 Okt: lahir ulang, cap 2099, gerbang HP lama, temuan diulang, arsip tutup buku, umur denyut (jsc + statis + kontrol)"
        if: matrix.bagian == 2
        run: python3 alat-uji/uji_hemat_baca.py && python3 alat-uji/uji_hemat_baca.py --kontrol
      # Keputusan owner 26 Sep: tiap halaman yang dicoba ulang di uji peramban menulis baris "DICOBA ULANG: <nama uji>" + peringatan di ringkasan
      # run. Sering muncul = masalah sungguhan, bukan Chrome yang lambat. Uji ini memakai Chrome PALSU (tanpa Chrome), jadi tempatnya di sini.
      - name: "Percobaan ulang uji peramban WAJIB tercatat: baris DICOBA ULANG + peringatan ringkasan run, selesai-tanpa-DOM ikut diulang, halaman sehat nol baris — Chrome palsu + kontrol"
        if: matrix.bagian == 1
        run: python3 -u alat-uji/uji_coba_ulang.py && python3 -u alat-uji/uji_coba_ulang.py --kontrol

  # ---- UJI PERAMBAN (25b): semua uji yang menyalakan Chrome headless, BERBARENGAN dengan `uji` ----
  # Di runner macOS satu kali Chrome jauh lebih lambat daripada di Mac pengembang (uji layar kunci saja ±5 menit). Dengan tiga
  # uji peramban + kontrolnya di dalam `uji`, pekerjaan itu melewati batas 10 menitnya (PR #41: dihentikan di kontrol antrean kasir
  # sesudah uji utamanya lulus 60/60). Dipisah supaya batas waktu tiap pekerjaan tetap berarti dan Pages tetap menunggu keduanya.
  uji-peramban:
    runs-on: macos-latest
    timeout-minutes: 60
    # 22 Nov 2026: empat uji Chrome dibagi DUA job paralel (dulu berurutan ±12 menit): 1 = tirai + antrean kasir (±6½ mnt), 2 = katalog + salinan (±5½ mnt)
    strategy:
      fail-fast: false
      matrix:
        bagian: [1, 2]
    steps:
      - name: Ambil isi repo
        uses: actions/checkout@v4

      - name: "Tirai & ganti orang (23c/23d): 0 angka rupiah sebelum masuk, keranjang & isian tujuh layar tidak terbawa ke akun berikutnya — Chrome headless + kontrol (keluar 4 = GAGAL JARINGAN)"
        if: matrix.bagian == 1
        run: python3 -u alat-uji/uji_layar_kunci.py && python3 -u alat-uji/uji_layar_kunci.py --kontrol
      - name: "Antrean kasir (25b): karcis ditolak server dipisah, sisanya tetap terkirim; 401 → layar masuk; sinyal/429/503 → tetap antre; denyut & versi; tahan muat ulang; tombol sungguhan diketuk di bawah CSP halaman (kanari diblokir, nol pelanggaran) — Chrome headless + Firestore palsu + kontrol"
        if: matrix.bagian == 1
        run: python3 -u alat-uji/uji_antrean_kasir.py && python3 -u alat-uji/uji_antrean_kasir.py --kontrol
      # uji_sistem_lama_bacasaja.py (25b B: penjaga tulis index.html) DIHAPUS 3 Okt 2026 bersama objeknya — sistem lama pensiun, index.html kini
      # halaman pengalih tanpa script (tidak ada jalan tulis lagi di situs).
      - name: "Katalog kasir dari /baru/ (25c): penyusun = sistem lama (terkunci sidik), kunci dokumen beku, ikut kiriman terbit harga, gerbang terbit, Beranda (kasir.html pensiun diam); HP penjaga mengambil katalog baru tanpa dibuka ulang — statis + jsc + Chrome headless + kontrol"
        if: matrix.bagian == 2
        run: python3 -u alat-uji/uji_katalog_kasir.py && python3 -u alat-uji/uji_katalog_kasir.py --kontrol
      - name: "Tablet dibuka tanpa internet (T1 langkah 4): Chrome sungguhan lewat DevTools — pasang salinan, KEDUA server mati lalu aplikasi tetap terbuka, versi baru dipasang sendiri di layar masuk, berkas basi ditolak (versi lama tetap) — Firebase palsu di asal lain, tanpa internet + kontrol"
        if: matrix.bagian == 2
        run: python3 -u alat-uji/uji_salinan_peramban.py && python3 -u alat-uji/uji_salinan_peramban.py --kontrol

  terbitkan:
    needs: [uji, uji-peramban]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ambil isi repo
        uses: actions/checkout@v4

      - name: Siapkan Pages
        uses: actions/configure-pages@v5

      # T1 langkah 4 (owner 16 Nov 2026): salinan aplikasi tablet. sw-baru.js di repo TIDAK dicap; di sini (hanya di runner, tidak di-commit) diisi
      # VERSI = commit ini, daftar SEMUA berkas halaman /baru/ + sidik SHA-256-nya. Tablet memasang versi ini hanya bila tiap berkas cocok sidiknya.
      - name: "Cap salinan aplikasi /baru/ (T1 langkah 4): daftar berkas + sidik SHA-256 versi ini ke baru/sw-baru.js"
        run: python3 alat-uji/cap_sw_baru.py --tulis

      - name: Bungkus seluruh folder apa adanya
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # TERBIT GAGAL "No artifacts named github-pages" (24 Nov 2026: run #989, #990, #994 gagal; #986, #992 berhasil — isi & versi action sama persis).
      # Bungkusan SUDAH terunggah ("successfully finalized"), tetapi deploy-pages ±0,5 detik sesudahnya menanyakan daftar bungkusan run ini ke layanan runtime
      # Actions dan kadang mendapat 0. Langkah tunggu lewat REST API (#194) TIDAK menolong: di run #994 REST sudah melihat bungkusannya pada percobaan pertama,
      # deploy-pages tetap mendapat 0 — yang terlambat adalah layanan yang ditanya deploy-pages, bukan REST. Jadi: jeda dulu, lalu deploy-pages DICOBA ULANG
      # (paling banyak tiga kali). Bungkusan diunggah SEKALI saja — yang diulang hanya langkah terbit, jadi tidak ada bungkusan kedua bernama sama
      # (itu sebab menjalankan ulang job ini dari awal tidak boleh). Tiap percobaan ulang ditulis "DICOBA ULANG" di ringkasan run (keputusan owner 26 Sep).
      - name: "Jeda 20 detik sebelum terbit (bungkusan baru saja diunggah)"
        run: sleep 20

      - name: Terbitkan
        id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: "DICOBA ULANG: terbitkan (percobaan 2 dari 3) — tunggu 45 detik"
        if: steps.deploy.outcome == 'failure'
        run: |
          echo "::warning title=DICOBA ULANG::terbitkan — deploy-pages gagal di percobaan 1 (biasanya: bungkusan belum terbaca layanan runtime); dicoba lagi sesudah 45 detik"
          echo "DICOBA ULANG: terbitkan — percobaan 2 dari 3" >> "$GITHUB_STEP_SUMMARY"
          sleep 45

      - name: Terbitkan (percobaan 2)
        id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: "DICOBA ULANG: terbitkan (percobaan 3 dari 3) — tunggu 90 detik"
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: |
          echo "::warning title=DICOBA ULANG::terbitkan — deploy-pages gagal di percobaan 2; percobaan terakhir sesudah 90 detik"
          echo "DICOBA ULANG: terbitkan — percobaan 3 dari 3" >> "$GITHUB_STEP_SUMMARY"
          sleep 90

      - name: Terbitkan (percobaan 3 — terakhir, gagal = job gagal)
        id: deploy3
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
