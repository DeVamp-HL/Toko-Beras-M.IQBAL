# GLADI TUTUP BUKU di SERVER TIRUAN — HANYA di runner (CLAUDE.md, keputusan owner 27 Sep 2026: peramban & emulator tidak di Mac owner). Tidak menerbitkan apa pun.
# Firebase Emulator Suite (Firestore + Auth) dengan aturan = firestore.rules repo, diisi DATA CONTOH sintetis skala toko (alat-uji/gladi_data_contoh.py, benih
# tetap — bukan data toko; cadangan asli tidak pernah ada di runner), lalu /baru/ ASLI di Chrome headless lewat ?emulator= menjalankan Uang › Tutup buku:
# LATIHAN (tanpa menulis), SUNGGUHAN yang diblokir gerbang lalu dibuka lewat putusan per tanggal (Paket A), dan ritual penuh di data yang sama — putusan,
# server yang menolak di tengah (lanjutkan / batalkan sebelum & sesudah penanda) sampai selesai, tiap titik diperiksa di SERVER. Tiap langkah dan tiap jalur
# (ritual bersih · batal) : baca / tulis / hapus vs batas Spark. Proyek emulator "demo-gladi-toko": tanpa kredensial, tanpa data toko.
# Manual: Actions › Gladi tutup buku › Run workflow. Otomatis di PR yang menyentuh tutup buku, kunci periode, uang, aturan server, sambungan Firebase.
name: Gladi tutup buku

on:
  workflow_dispatch:
    inputs:
      skenario:
        description: 'Skenario (dipisah koma): latihan, gerbang, ritual'
        default: 'latihan,gerbang,ritual'
      kontrol:
        description: 'Jalankan juga kontrol (salinan uji yang dirusak wajib ketahuan)'
        type: boolean
        default: true
      skala:
        description: 'Skala data contoh (0,65 = ±9 rb dokumen; emulator membatasi 10.000 pesan antre per kanal)'
        default: '0.65'
  pull_request:
    paths:
      - 'baru/js/layar/tutup-buku-logika.js'
      - 'baru/js/layar/kunci-periode-logika.js'
      - 'baru/js/layar/uang.js'
      - 'baru/js/data/kunci-periode.js'
      - 'baru/js/data/firebase.js'
      - 'baru/js/data/server-tiruan.js'
      - 'baru/js/data/toko.js'
      - 'baru/js/mesin/**'
      - 'firestore.rules'
      - 'alat-uji/gladi_data_contoh.py'
      - 'alat-uji/gladi_tutup_buku.py'
      - '.github/workflows/gladi-tutup-buku.yml'

permissions:
  contents: read

concurrency:
  group: gladi-tutup-buku-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'   # jangan tinggalkan __pycache__ di folder repo (pemeriksaan "tidak ada berkas repo yang berubah")
  FIREBASE_TOOLS_VERSI: '15.32.1'
  PROYEK_GLADI: 'demo-gladi-toko'

jobs:
  gladi:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      GLADI_SKENARIO: ${{ github.event.inputs.skenario || 'latihan,gerbang,ritual' }}
      GLADI_SKALA: ${{ github.event.inputs.skala || '0.65' }}
    steps:
      - name: Ambil isi repo
        uses: actions/checkout@v4

      - name: Java untuk emulator Firestore
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Node untuk firebase-tools (dan penilai data contoh)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Simpanan jar emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: emulator-firebase-tools-${{ env.FIREBASE_TOOLS_VERSI }}

      - name: Pasang firebase-tools
        run: |
          npm install -g "firebase-tools@${FIREBASE_TOOLS_VERSI}"
          firebase --version; java -version; google-chrome --version
          firebase setup:emulators:firestore

      - name: Data contoh dinilai logika /baru/ asli (31 Des LATIHAN 12 baris sama, gerbang per varian, 1 Jan macet ditolak tanpa putusan lalu kiriman bertahap ≤ 18) + kontrol
        run: python3 alat-uji/gladi_data_contoh.py --periksa && python3 alat-uji/gladi_data_contoh.py --kontrol

      - name: Salinan uji gladi (statis) — connect-src salinan tanpa host Firebase sungguhan + alamat emulator, jam palsu, SDK penghitung, nama langkah & jangkar kontrol
        run: python3 alat-uji/gladi_tutup_buku.py --periksa-salinan

      # Proyek emulator di folder sementara: firebase.json gladi + SALINAN firestore.rules repo (byte sama; gladi juga memasang ulang teks repo lewat REST
      # sebelum mulai). Log emulator tidak jatuh ke folder repo.
      - name: Siapkan proyek emulator
        run: |
          P="$RUNNER_TEMP/proyek-gladi"; mkdir -p "$P" gladi-hasil
          cp firestore.rules "$P/firestore.rules"; cmp firestore.rules "$P/firestore.rules"
          cat > "$P/firebase.json" <<'JSON'
          {
            "firestore": { "rules": "firestore.rules" },
            "emulators": {
              "firestore": { "host": "127.0.0.1", "port": 8080 },
              "auth": { "host": "127.0.0.1", "port": 9099 },
              "ui": { "enabled": false },
              "singleProjectMode": true
            }
          }
          JSON
          cat "$P/firebase.json"

      # Tiap skenario di EMULATOR SENDIRI: emulator tetap mengirimi sesi WebChannel halaman yang sudah ditutup sampai kanalnya kedaluwarsa (run 7 Okt:
      # 2,2 juta baris "antrean penuh" ketika ritual berjalan sesudah dua skenario lain). Laporan per skenario digabung sesudahnya.
      - name: "GLADI — emulator Firestore + Auth, /baru/ di Chrome headless: latihan · gerbang · ritual"
        working-directory: ${{ runner.temp }}/proyek-gladi
        run: |
          gagal=0
          IFS=',' read -ra DAFTAR <<< "$GLADI_SKENARIO"
          for s in "${DAFTAR[@]}"; do
            case "$s" in latihan|gerbang|ritual) ;; *) echo "skenario tidak dikenal: $s"; exit 2;; esac
            echo "::group::skenario $s"
            rm -f firestore-debug.log
            firebase emulators:exec --only firestore,auth --project "$PROYEK_GLADI" \
              "python3 -u '$GITHUB_WORKSPACE/alat-uji/gladi_tutup_buku.py' --skenario $s --keluar '$GITHUB_WORKSPACE/gladi-hasil/skenario-$s.json'" || gagal=1
            tail -c 20000000 firestore-debug.log > "$GITHUB_WORKSPACE/gladi-hasil/firestore-debug-$s.log" 2>/dev/null || true
            echo "::endgroup::"
          done
          python3 "$GITHUB_WORKSPACE/alat-uji/gladi_tutup_buku.py" --gabung "$GITHUB_WORKSPACE"/gladi-hasil/skenario-*.json \
            --keluar "$GITHUB_WORKSPACE/gladi-hasil/laporan-gladi.json" --ringkasan "$GITHUB_WORKSPACE/gladi-hasil/ringkasan.md" || gagal=1
          exit $gagal

      - name: Ringkasan gladi ke halaman run
        if: always()
        run: |
          if [ -f gladi-hasil/ringkasan.md ]; then cat gladi-hasil/ringkasan.md >> "$GITHUB_STEP_SUMMARY"; else echo "Ringkasan gladi tidak terbentuk — lihat log langkah GLADI." >> "$GITHUB_STEP_SUMMARY"; fi

      # Tiap kontrol di EMULATOR SENDIRI (sama dengan skenario): sesi kanal halaman kontrol sebelumnya tidak boleh membanjiri muat kontrol berikutnya — kontrol
      # yang ceknya ikut gagal karena antrean emulator dihitung DIAM, bukan berbunyi.
      - name: "KONTROL — salinan uji dirusak (latihan menulis, latihan menulis tertunda, gerbang g1 dibuang, satu koleksi tidak lengkap, pemulihan arsip kurang satu) wajib ketahuan karena sebab yang benar"
        if: success() && (github.event_name == 'pull_request' || github.event.inputs.kontrol == 'true')
        working-directory: ${{ runner.temp }}/proyek-gladi
        run: |
          N=$(python3 "$GITHUB_WORKSPACE/alat-uji/gladi_tutup_buku.py" --jumlah-kontrol); test "$N" -ge 1
          gagal=0
          for i in $(seq 1 "$N"); do
            echo "::group::kontrol $i dari $N"
            rm -f firestore-debug.log
            firebase emulators:exec --only firestore,auth --project "$PROYEK_GLADI" "python3 -u '$GITHUB_WORKSPACE/alat-uji/gladi_tutup_buku.py' --kontrol $i" || gagal=1
            tail -c 20000000 firestore-debug.log > "$GITHUB_WORKSPACE/gladi-hasil/firestore-debug-kontrol-$i.log" 2>/dev/null || true
            echo "::endgroup::"
          done
          exit $gagal

      - name: Log firebase-tools ke artefak
        if: always()
        run: cp "$RUNNER_TEMP"/proyek-gladi/firebase-debug.log gladi-hasil/ 2>/dev/null || true

      - name: Artefak laporan gladi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-gladi-tutup-buku
          path: gladi-hasil/
          if-no-files-found: warn

      - name: Tidak ada Chrome headless tersisa + tidak ada berkas repo yang berubah
        if: always()
        run: |
          if pgrep -fl "chrome.*--headless"; then echo "Chrome headless masih hidup"; exit 1; fi
          git status --porcelain -- . ':!gladi-hasil'
          test -z "$(git status --porcelain -- . ':!gladi-hasil')"
