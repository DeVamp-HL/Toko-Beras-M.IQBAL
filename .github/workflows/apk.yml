name: Bangun APK tablet kasir

# Putaran T1 langkah 2 (16 Nov 2026): aplikasi Android pembungkus /baru/ untuk Sunmi CPad + plugin cetak USB (apk/).
# Owner 23 Nov 2026: push aplikasi tablet (plugin resmi @capacitor/push-notifications) — rahasia repo GOOGLE_SERVICES_JSON = isi google-services.json.
# Paket S1 (19 Nov 2026): cangkang SUNMI — pustaka resmi SUNMI (printer, lampu), scanner; tanda tangan V1 + V2 dibuktikan (syarat SUNMI App Store).
# Dibangun di runner — Mac owner tidak perlu Node/Android Studio (README-PROYEK: tanpa build, tanpa Node untuk /baru/).
# Hasil: artefak "apk-tablet-kasir" di halaman run ini (Actions › run › Artifacts), diunduh lalu dipasang di CPad.
#
# Kunci tanda tangan (supaya APK baru bisa dipasang MENIMPA yang lama tanpa hapus data): rahasia repo
#   APK_KEYSTORE_B64 (keystore .jks dalam base64) · APK_KEYSTORE_PASSWORD · APK_KEY_ALIAS · APK_KEY_PASSWORD
# Tanpa rahasia itu yang dibangun APK DEBUG: bisa dipasang & dicoba, tapi tiap bangun bertanda tangan beda — memasang yang baru
# berarti hapus aplikasi lama dulu (masuk akun & setelan printer di tablet hilang).
#
# Google Play privat (23 Nov 2026, docs/google-play.md): dari bangun yang SAMA keluar juga AAB (artefak terpisah "aab-google-play") untuk jalur
# UJI INTERNAL Play — versionCode & targetSdk sama dengan APK, ditandatangani kunci yang sama (= kunci unggah Play). APK tetap dibangun & disimpan
# seperti biasa; AAB gagal TIDAK menghilangkan APK (artefak APK disimpan lebih dulu, run tetap merah supaya ketahuan). Tanpa rahasia kunci: tanpa AAB.

on:
  workflow_dispatch:
  push:
    paths:
      - 'apk/**'
      - '.github/workflows/apk.yml'
  pull_request:
    paths:
      - 'apk/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Ambil isi repo
        uses: actions/checkout@v5

      - name: Java 21 (syarat Capacitor 7)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Python + Pillow (ikon)
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # 19 Nov 2026 (run 6): Maven Central menjawab 429 "Too Many Requests" ke runner → bangun gagal sebelum satu baris pun dikompilasi.
      # Pustaka yang sudah terunduh disimpan antar-run supaya bangun berikutnya nyaris tidak menyentuh Maven Central.
      - name: Simpanan pustaka Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-apk-${{ hashFiles('apk/package.json', 'apk/pasang.py') }}
          restore-keys: gradle-apk-

      - name: Pasang Capacitor
        working-directory: apk
        run: |
          python -m pip install --quiet pillow
          npm install --no-audit --no-fund
          npx cap --version

      - name: Buat proyek Android
        working-directory: apk
        run: |
          npx cap add android
          npx cap sync android

      - name: Pasang plugin perangkat (cetak USB, SDK SUNMI, pindai, lampu), izin USB, ikon, versi, berkas Firebase push tablet
        env:
          # owner 23 Nov 2026: isi berkas google-services.json (Firebase Console › aplikasi Android id.miqbal.tokoberas). Kosong = APK tanpa push tablet.
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python apk/pasang.py --versi ${{ github.run_number }}
          if [ -f apk/android/app/google-services.json ]; then echo "### Push tablet: berkas Firebase TERPASANG (notifikasi tablet bisa dinyalakan)" >> "$GITHUB_STEP_SUMMARY"
          else echo "### Push tablet: TANPA berkas Firebase — rahasia GOOGLE_SERVICES_JSON belum ada (docs/notifikasi-tablet.md)" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Bangun APK
        working-directory: apk/android
        env:
          KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          mkdir -p ../keluaran
          # Bangun, dicoba ulang HANYA kalau gagalnya unduhan pustaka (429 / putus / habis waktu / pustaka "tidak ditemukan") — galat kompilasi
          # tidak diulang, langsung gagal. Run 9 (19 Nov): Maven Central yang sedang membatasi menjawab seolah pustakanya tidak ada
          # ("Could not find org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.20"), padahal run kembarannya di commit yang sama mengunduhnya.
          # Pustaka yang SUNGGUH tidak ada (versi salah ketik) tetap gagal — sesudah tiga percobaan yang semuanya tercatat.
          # Keputusan owner 26 Sep 2026: tiap percobaan ulang tercatat — satu baris DICOBA ULANG di log + peringatan di ringkasan run.
          UNDUH_GAGAL='Received status code (429|5[0-9][0-9])[^.]*|Read timed out|Connection (reset|refused|timed out)|Could not GET |Could not find [A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+'
          bangun() {
            local n segar
            for n in 1 2 3; do
              # percobaan ulang memaksa Gradle bertanya lagi ke gudang pustaka: jawaban "tidak ada" tadi diingatnya 24 jam
              segar=''; if [ "$n" -gt 1 ]; then segar='--refresh-dependencies'; fi
              if ./gradlew --no-daemon $segar "$1" 2>&1 | tee "$RUNNER_TEMP/gradle-$n.log"; then return 0; fi
              if [ "$n" = 3 ] || ! grep -qE "$UNDUH_GAGAL" "$RUNNER_TEMP/gradle-$n.log"; then return 1; fi
              echo "DICOBA ULANG: bangun APK ($1) — unduhan pustaka gagal: $(grep -oE "$UNDUH_GAGAL" "$RUNNER_TEMP/gradle-$n.log" | sort | uniq -c | sort -rn | head -1 | sed 's/^ *//') (percobaan $((n + 1)) dari 3, menunggu $((n * 60)) detik)"
              echo "::warning title=DICOBA ULANG::bangun APK ($1) — unduhan pustaka gagal, percobaan $((n + 1)) dari 3"
              sleep $((n * 60))
            done
          }
          if [ -n "$KEYSTORE_B64" ]; then
            bangun assembleRelease
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kunci.jks"
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/rata.apk"
            # SUNMI App Store ("APK Uploading FAQs"): APK wajib bertanda tangan V1 DAN V2 → dua-duanya dinyalakan terang-terangan, lalu DIBUKTIKAN
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/kunci.jks" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASSWORD --v1-signing-enabled true --v2-signing-enabled true \
              --out "../keluaran/toko-beras-kasir-1.${{ github.run_number }}.apk" "$RUNNER_TEMP/rata.apk"
            # minSdk 24 (Google Play, 26 Nov 2026): apksigner verify memeriksa skema menurut minSdk APK — sejak 24 V1 DILEWATI ("v1 ... false") walau
            # tanda tangannya ada. --min-sdk-version 23 = verifikasi seolah untuk Android 6, jadi V1 sungguh diperiksa (bukan dianggap lulus).
            "$BT/apksigner" verify -v --min-sdk-version 23 "../keluaran/toko-beras-kasir-1.${{ github.run_number }}.apk" | tee "$RUNNER_TEMP/tanda.txt"
            grep -q 'Verified using v1 scheme (JAR signing): true' "$RUNNER_TEMP/tanda.txt" || { echo "GAGAL: APK tidak bertanda tangan V1"; exit 1; }
            grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/tanda.txt" || { echo "GAGAL: APK tidak bertanda tangan V2"; exit 1; }
            rm -f "$RUNNER_TEMP/kunci.jks"
            echo "### APK RILIS bertanda tangan kunci toko (V1 + V2 terbukti) — bisa dipasang menimpa versi lama" >> "$GITHUB_STEP_SUMMARY"
            # Google Play: bundel dari proyek & versi yang sama (pustaka sudah terunduh oleh assembleRelease). Gagal di sini TIDAK menggagalkan langkah
            # ini — APK di atas tetap disimpan; langkah "Tanda tangani & periksa AAB" yang merah.
            if bangun bundleRelease; then echo "AAB_SIAP=1" >> "$GITHUB_ENV"
            else echo "::error title=AAB Google Play::bundleRelease gagal — APK tetap disimpan, AAB tidak ada"; fi
          else
            bangun assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "../keluaran/toko-beras-kasir-1.${{ github.run_number }}-debug.apk"
            echo "### APK DEBUG (rahasia APK_KEYSTORE_* belum ada) — memasang versi baru = hapus aplikasi lama dulu" >> "$GITHUB_STEP_SUMMARY"
          fi
          ls -la ../keluaran

      - name: Simpan APK
        uses: actions/upload-artifact@v5
        with:
          name: apk-tablet-kasir
          path: apk/keluaran/*.apk
          retention-days: 30

      # Google Play (23 Nov 2026): AAB ditandatangani kunci yang sama dengan APK (jarsigner = tanda tangan bundel; apksigner hanya untuk APK).
      # Diperiksa sebelum disimpan: targetSdk >= 36 (syarat aplikasi baru), kunci RSA >= 2048 bit (syarat kunci unggah), tanda tangan terverifikasi,
      # bentuk bundel + pustaka native 16 KB (apk/periksa_aab.py). Sertifikat kunci memuat nama pemiliknya → yang ditampilkan HANYA baris algoritma
      # & sidik SHA-256 (sidik itu juga terbaca dari APK mana pun; dicocokkan owner di Play Console › Play app signing).
      - name: Tanda tangani & periksa AAB (Google Play)
        working-directory: apk/android
        env:
          KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "### AAB Google Play: TIDAK dibangun — rahasia APK_KEYSTORE_* belum ada (Play menolak bundel bertanda tangan debug)" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          [ "${AAB_SIAP:-}" = 1 ] || { echo "GAGAL: bundleRelease tidak menghasilkan AAB (lihat log langkah Bangun APK) — APK sudah tersimpan"; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(ls ../keluaran/*.apk | head -1)
          SASARAN=$("$BT/aapt2" dump badging "$APK" | sed -n "s/^targetSdkVersion:'\([0-9]*\)'.*/\1/p" | head -1)
          [ "${SASARAN:-0}" -ge 36 ] || { echo "GAGAL: targetSdk ${SASARAN:-?} < 36 — Google Play menolak aplikasi baru yang tidak menyasar Android 16 (apk/pasang.py SDK_SASARAN)"; exit 1; }
          MINIMUM=$("$BT/aapt2" dump badging "$APK" | sed -n "s/^sdkVersion:'\([0-9]*\)'.*/\1/p" | head -1)
          [ "${MINIMUM:-0}" -ge 24 ] || { echo "GAGAL: minSdk ${MINIMUM:-?} < 24 — perlindungan otomatis Google Play menolak bundel (apk/pasang.py SDK_MINIMUM)"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kunci.jks"
          keytool -list -v -keystore "$RUNNER_TEMP/kunci.jks" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" > "$RUNNER_TEMP/kunci.txt" || true
          ALGO=$(grep -m1 'Subject Public Key Algorithm' "$RUNNER_TEMP/kunci.txt" | sed 's/^[^:]*: *//' || true)
          SIDIK=$(grep -m1 -E '^[[:space:]]*SHA256:' "$RUNNER_TEMP/kunci.txt" | sed 's/^[^:]*: *//' || true)
          rm -f "$RUNNER_TEMP/kunci.txt"
          BIT=$(echo "$ALGO" | grep -oE '^[0-9]+' || true)
          if ! echo "$ALGO" | grep -q 'RSA' || [ "${BIT:-0}" -lt 2048 ]; then
            rm -f "$RUNNER_TEMP/kunci.jks"; echo "GAGAL: kunci unggah Google Play wajib RSA >= 2048 bit (kunci ini: ${ALGO:-tidak terbaca})"; exit 1
          fi
          AAB="../keluaran/toko-beras-kasir-1.${{ github.run_number }}.aab"
          jarsigner -keystore "$RUNNER_TEMP/kunci.jks" -storepass:env KEYSTORE_PASSWORD -keypass:env KEY_PASSWORD -digestalg SHA-256 \
            -signedjar "$AAB" app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS" > /dev/null
          rm -f "$RUNNER_TEMP/kunci.jks"
          jarsigner -verify "$AAB" > "$RUNNER_TEMP/aab.txt" || true
          grep -q 'jar verified' "$RUNNER_TEMP/aab.txt" || { cat "$RUNNER_TEMP/aab.txt"; echo "GAGAL: tanda tangan AAB tidak terverifikasi"; exit 1; }
          python3 ../periksa_aab.py "$AAB"
          ls -la ../keluaran
          {
            echo "### AAB Google Play (uji internal) — $(basename "$AAB")"
            echo "- targetSdk $SASARAN · kunci $ALGO · tanda tangan terverifikasi · bentuk bundel & pustaka native 16 KB lulus"
            echo "- sidik SHA-256 sertifikat kunci: \`$SIDIK\` — cocokkan dengan Play Console › Play app signing (docs/google-play.md)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Simpan AAB (Google Play)
        if: env.AAB_SIAP == '1'
        uses: actions/upload-artifact@v5
        with:
          name: aab-google-play
          path: apk/keluaran/*.aab
          retention-days: 30
          if-no-files-found: error
