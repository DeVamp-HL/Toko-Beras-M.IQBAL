# BUKTI SERVER RULES — HANYA di runner (CLAUDE.md, keputusan owner 27 Sep 2026: emulator & peramban tidak di Mac owner). Tidak menerbitkan apa pun.
# Firebase Emulator Firestore (mesin rules yang sama dengan server produksi) diberi teks firestore.rules repo lewat REST; semua kasus docs/uji-rules-v7.md
# (+ kasus model M-*, kasus server S-*, kasus H "berita acara hanya maju" v6) dikirim dengan token akun palsu (JWT tanpa tanda tangan — hanya emulator
# yang menerimanya); tahun dokumen uji digeser ke jam runner (tetap mengukur sesudah 1 Jan 2027); kasus yang sama atas firestore.rules.v6 (beda wajib =
# lima ubahan); rules dirusak satu suku wajib berbunyi; kode ASLI kasir darurat kasir-v33 & kasir-v32 (node) mengirim ulang karcis ke emulator. Proyek
# emulator "demo-uji-rules": tanpa kredensial, tanpa data toko. alat-uji/uji_rules_emulator.py.
# Manual: Actions › Uji rules di emulator › Run workflow. Otomatis di PR yang menyentuh rules, kasir darurat, kasus Playground, atau alatnya.
name: Uji rules di emulator

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firestore.rules.v6'
      - 'kasir-darurat-nominal.html'
      - 'docs/uji-rules-v7.md'
      - 'alat-uji/uji_rules_emulator.py'
      - 'alat-uji/kasir_emulator.js'
      - 'alat-uji/periksa_rules.py'
      - 'alat-uji/rules_mini.py'
      - '.github/workflows/uji-rules-emulator.yml'

permissions:
  contents: read

concurrency:
  group: uji-rules-emulator-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'   # jangan tinggalkan __pycache__ di folder repo (pemeriksaan "tidak ada berkas repo yang berubah")
  FIREBASE_TOOLS_VERSI: '15.32.1'
  PROYEK_RULES: 'demo-uji-rules'

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # riwayat penuh: kasir darurat kasir-v32 (HP penjaga sebelum cabang hemat baca) dibaca dari commit main lewat git show
      - name: Ambil isi repo (riwayat penuh)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java untuk emulator Firestore
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Node untuk firebase-tools & kode kasir darurat
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Simpanan jar emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: emulator-firebase-tools-${{ env.FIREBASE_TOOLS_VERSI }}

      - name: Pasang firebase-tools
        run: |
          npm install -g "firebase-tools@${FIREBASE_TOOLS_VERSI}"
          firebase --version; java -version; node --version
          firebase setup:emulators:firestore

      - name: Statis + model + kode kasir di server palsu (node) — sama dengan job uji, di sini dengan kasir-v32 dari riwayat git
        run: python3 alat-uji/uji_rules_emulator.py --periksa && python3 alat-uji/uji_rules_emulator.py --kontrol

      # Proyek emulator di folder sementara: firebase.json + SALINAN firestore.rules repo (byte sama). Alat uji memasang teks rules lewat REST sebelum
      # tiap bagian (v7, v6, kontrol) — rules yang dimuat firebase.json hanya awal.
      - name: Siapkan proyek emulator
        run: |
          P="$RUNNER_TEMP/proyek-rules"; mkdir -p "$P" hasil-rules
          cp firestore.rules "$P/firestore.rules"; cmp firestore.rules "$P/firestore.rules"
          cat > "$P/firebase.json" <<'JSON'
          {
            "firestore": { "rules": "firestore.rules" },
            "emulators": {
              "firestore": { "host": "127.0.0.1", "port": 8080 },
              "ui": { "enabled": false },
              "singleProjectMode": true
            }
          }
          JSON
          cat "$P/firebase.json"

      - name: "BUKTI SERVER — semua kasus Playground v7 (+ M, S, H hanya maju) · v6 · kontrol rules dirusak · kasir darurat kasir-v33 & kasir-v32 kirim ulang"
        working-directory: ${{ runner.temp }}/proyek-rules
        run: |
          firebase emulators:exec --only firestore --project "$PROYEK_RULES" \
            "python3 -u '$GITHUB_WORKSPACE/alat-uji/uji_rules_emulator.py' --emulator --keluar '$GITHUB_WORKSPACE/hasil-rules/hasil.json' --ringkasan '$GITHUB_WORKSPACE/hasil-rules/ringkasan.md'"

      - name: Ringkasan ke halaman run
        if: always()
        run: |
          if [ -f hasil-rules/ringkasan.md ]; then cat hasil-rules/ringkasan.md >> "$GITHUB_STEP_SUMMARY"; else echo "Ringkasan tidak terbentuk — lihat log langkah BUKTI SERVER." >> "$GITHUB_STEP_SUMMARY"; fi
          cp "$RUNNER_TEMP"/proyek-rules/firestore-debug.log hasil-rules/ 2>/dev/null || true

      - name: Artefak hasil
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bukti-server-rules
          path: hasil-rules/
          if-no-files-found: warn

      - name: Tidak ada berkas repo yang berubah
        if: always()
        run: |
          git status --porcelain -- . ':!hasil-rules'
          test -z "$(git status --porcelain -- . ':!hasil-rules')"
